<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f7b4f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f6f7f9;--c:#fff;--t:#1b1f24;--m:#6b7280;--p:#0f7b4f;--b:#e5e7eb;--r:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--c:#1e2327;--t:#e8eaed;--m:#9aa3ad;--b:#2d343a}}
*{box-sizing:border-box}
body{margin:0;font:15px system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--c);border-bottom:1px solid var(--b)}
#stk{position:sticky;top:0;z-index:6;background:var(--c)}
nav{display:flex;overflow-x:auto;background:var(--c);border-bottom:1px solid var(--b)}
#cb{gap:8px;overflow-x:auto;padding:6px 10px;border-bottom:1px solid var(--b);font-size:13px;cursor:pointer;background:var(--bg)}
.chip{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:3px 10px;white-space:nowrap}
nav button{flex:1;min-width:72px;padding:11px 6px;border:0;background:none;color:var(--m);font:inherit;border-bottom:3px solid transparent}
nav button.on{color:var(--p);border-color:var(--p);font-weight:700}
main{padding:12px;max-width:720px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:12px}
input,select{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit;margin:4px 0}
button.b,a.b{padding:10px 14px;border:0;border-radius:8px;background:var(--p);color:#fff;font:inherit;font-weight:700}
button.b.s{background:var(--b);color:var(--t)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--b)}
.m{color:var(--m);font-size:13px}.neg{color:var(--r)}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--b);text-align:start;font-size:13px}
.strike{text-decoration:line-through}.ok{color:var(--p)}
#cs{background:#fff3cd;color:#664d03;padding:8px 14px;font-size:13px;line-height:1.7}
@media(prefers-color-scheme:dark){#cs{background:#4a3b0a;color:#ffe69c}}
#done{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:18px}
#done .dn{background:var(--c);color:var(--t);border-radius:16px;padding:20px;max-width:420px;width:100%;text-align:center}
a{color:var(--p)}a.b{color:#fff}
details{border-bottom:1px solid var(--b);padding:9px 0}summary{font-weight:700;cursor:pointer}
details ol,details ul{margin:8px 0;padding-inline-start:22px;line-height:1.9}
#scan{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
#reader{width:100%;max-width:480px}#scan .m{color:#fff;text-align:center}
#rcpt{display:none}
@media print{body>*:not(#rcpt){display:none!important}#rcpt{display:block;width:72mm;font:12px system-ui,Tahoma,sans-serif;color:#000}}
#toast{position:fixed;bottom:16px;left:12px;right:12px;background:#222;color:#fff;padding:12px;border-radius:10px;display:none;z-index:9}
</style>
</head>
<body>
<div id="app"></div>
<div id="rcpt"></div>
<div id="scan"><div id="reader"></div><div class="m" id="sh"></div><button class="b" onclick="closeScan()">إغلاق</button></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const URL_='https://xeeqyedzueuzdlfsqjyh.supabase.co',KEY='sb_publishable_mELxzgngQxrZ3JZuyNJqGg_Aw7jGUEg';
const db=supabase.createClient(URL_,KEY,{global:{fetch:(u,o={})=>{if(o.signal)return fetch(u,o);const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);return fetch(u,{...o,signal:c.signal}).finally(()=>clearTimeout(t))}}});
const BRAND='الوسام للمحاسبة والمستودعات',WA='963933267910',WAV='+963 933 267 910';
const waLink=()=>'https://wa.me/'+WA+'?text='+encodeURIComponent('مرحباً، أحتاج مساعدة بخصوص '+BRAND);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en',{maximumFractionDigits:2});
const uid=()=>crypto.randomUUID();
let S={shop:null,prods:[],parts:[],cart:[],cur:'SYP',mode:'sale',tab:'sale',wh:localStorage.wh||null,whs:[],lv:{}};
const lvl=(p,w)=>S.lv[p+'|'+w]||0;
const whHint=id=>S.whs.filter(w=>w.id!=S.wh&&lvl(id,w.id)>0).map(w=>w.name+' ('+fmt(lvl(id,w.id))+')').join('، ');
const rate=c=>c==='USD'?+S.shop.usd_rate:1;
const can=k=>S.role=='owner'||(S.perms||[]).includes(k),canAny=ks=>ks.some(can);
const TABP={sale:['sell'],buy:['purchase'],hist:['sell','invoices','edit_invoices','reports'],debt:['vouchers'],vch:['vouchers'],rcv:['vouchers'],rep:['reports'],stock:['stock'],mfg:['mfg'],acc:['accounts'],team:'o',co:'o',bkp:'o'};
const tabOk=k=>{const p=TABP[k];return !p||(p==='o'?S.role=='owner':canAny(p))};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',4500)}

/* ---- الاتصال بالدوال + طابور الإرسال عند انقطاع الإنترنت ---- */
const bad=e=>!navigator.onLine||/fetch|network|abort|load failed|timeout/i.test((e&&e.message)||'');
const ld=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>ld(new Date());
const LBL={post_sale_wh:'فاتورة بيع',post_purchase_wh:'فاتورة شراء',record_payment:'سند قبض/دفع',post_settlement:'سند قبض/دفع',record_expense:'مصروف',record_equity:'رأس مال/سحب',post_opening_stock_wh:'مخزون افتتاحي',post_opening_partner:'رصيد افتتاحي'};
const qGet=()=>JSON.parse(localStorage.q||'[]'),qSet=a=>{localStorage.q=JSON.stringify(a);pqUpdate()};
const fdt=t=>new Date(t).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'});
function qMeta(fn,a){
  const amt=a.p_items?a.p_items.reduce((s,i)=>s+(+i.qty)*(+(i.price??i.unit_cost)||0),0):(+a.p_amount||0);
  return {ts:Date.now(),label:LBL[fn]||fn,amount:Math.round(amt*100)/100,cur:a.p_currency||'SYP',who:a.p_partner?((S.parts.find(p=>p.id==a.p_partner)||{}).name||''):''}
}
function optStock(fn,a){
  if(fn!='post_sale_wh'&&fn!='post_purchase_wh')return;
  const sg=fn=='post_sale_wh'?-1:1;
  (a.p_items||[]).forEach(i=>{
    const k=i.product_id+'|'+(a.p_wh||S.wh);S.lv[k]=(S.lv[k]||0)+sg*(+i.qty);
    const p=S.prods.find(x=>x.id==i.product_id);if(p)p.stock_qty=+p.stock_qty+sg*(+i.qty)
  });
  saveCache()
}
async function call(fn,args,q){
  if(/^(post_|record_)/.test(fn)&&!args.p_date)args.p_date=today();
  const enqueue=()=>{const Q=qGet();Q.push({fn,args,meta:qMeta(fn,args)});qSet(Q);optStock(fn,args);return null};
  if(q&&!navigator.onLine)return enqueue();
  const {data,error}=await db.rpc(fn,args).then(r=>r,e=>({error:e}));
  if(!error){if(/^(post_|record_|void_|edit_)/.test(fn))setTimeout(()=>cashBar(true),300);return data||1}
  if(q&&bad(error))return enqueue();
  toast(/stock_levels|check constraint/.test(error.message)?'الكمية الإجمالية غير كافية في المخزون':error.message)
}
/* ---- شريط أرصدة الصناديق الثابت ---- */
let CBT=0;
async function cashBar(force){
  if(!S.shop||!$('#cb'))return;
  if(!navigator.onLine){cashBarDraw();return}
  if(!force&&Date.now()-CBT<1500)return;
  CBT=Date.now();
  const {data,error}=await db.rpc('cash_summary',{p_shop:S.shop.id});
  if(error||!data)return;
  S.cbx=data;cashBarDraw()
}
function cashBarDraw(){
  const el=$('#cb');if(!el)return;
  if(!S.cbx||!S.cbx.length){el.style.display='none';return}
  const q=JSON.parse(localStorage.q||'[]').length,off=!navigator.onLine;
  el.style.display='flex';el.style.opacity=off?'.65':'1';
  el.innerHTML=S.cbx.map(c=>{const u=c.sys_code=='1011',v=u?+c.usd:+c.base;
    return `<span class=chip>${u?'💵':'🏦'} ${esc(c.name)} <b class="${v<0?'neg':''}">${u?'$'+fmt(v):fmt(v)}</b></span>`}).join('')
    +((off||q)?`<span class=chip style="background:#fff3cd;color:#664d03">⏳ ${off?'بدون اتصال':q+' عملية معلّقة'}: الأرصدة غير محدّثة</span>`:'')
}
addEventListener('online',()=>cashBar(true));addEventListener('offline',cashBarDraw);
let FL=false;
async function flush(){
  if(FL||!navigator.onLine)return;
  const Q=qGet();if(!Q.length)return;
  FL=true;let ok=0;const keep=[];
  try{
    for(const x of Q){
      const {error}=await db.rpc(x.fn,x.args).then(r=>r,e=>({error:e}));
      if(!error)ok++;
      else if(bad(error))keep.push(x);
      else{const f=JSON.parse(localStorage.f||'[]');f.push({...x,err:error.message});localStorage.f=JSON.stringify(f);toast('رفض الخادم عملية مؤجلة: '+error.message)}
    }
  }finally{FL=false}
  qSet(keep);
  if(ok){toast('تم ترحيل '+ok+' عملية إلى النظام ✓');if(S.shop){await refresh();if(S.tab=='hist')histV()}}
}
addEventListener('online',()=>{pqUpdate();flush();if(S.cached){S.cached=false;load()}});
addEventListener('offline',pqUpdate);
setInterval(()=>{if(navigator.onLine&&qGet().length)flush()},30000);

/* ---- الدخول ---- */
async function boot(){
  let session=null;
  try{const r=await db.auth.getSession();session=r.data.session}catch(e){}
  if(session)return load();
  if(!navigator.onLine&&useCacheOk())return;
  authView()
}
function authView(){
  $('#app').innerHTML=`<main><div class=card style="text-align:center"><img src="icon-192.png" width=96 height=96 alt="" style="border-radius:22px;box-shadow:0 4px 14px rgba(0,0,0,.25)"><h2 style="margin:10px 0 14px">${BRAND}</h2>
  <input id=em type=email dir=ltr placeholder="الإيميل"><input id=pw type=password dir=ltr placeholder="كلمة السر (6 أحرف على الأقل)">
  <div class=row><button class=b onclick="auth(0)">دخول</button><button class="b s" onclick="auth(1)">حساب جديد</button></div></div>
  <div class=m style="text-align:center;margin-top:8px">للتواصل والدعم: <a href="${waLink()}" target=_blank rel=noopener>واتساب <span dir=ltr>${WAV}</span></a></div></main>`
}
async function auth(up){
  const e=$('#em').value.trim(),p=$('#pw').value;
  const {data,error}=up?await db.auth.signUp({email:e,password:p}):await db.auth.signInWithPassword({email:e,password:p});
  if(error)return toast(error.message);
  if(!data.session)return toast('تحقق من إيميلك لتأكيد الحساب');
  load()
}
async function load(){
  const {data,error:le}=await db.from('shops').select('*').limit(1).then(r=>r,e=>({data:null,error:e}));
  if(le&&bad(le)&&useCacheOk())return;
  if(!data||!data.length)return newShopView();
  S.shop=data[0];
  const {data:{session:ss}}=await db.auth.getSession(),user=ss.user;
  const m=await db.from('shop_members').select('role,warehouse_id,perms').eq('shop_id',S.shop.id).eq('user_id',user.id).single();
  S.role=(m.data||{}).role||'cashier';S.fixedWh=(m.data||{}).warehouse_id||null;S.perms=(m.data||{}).perms||['sell'];
  S.cached=false;
  await refresh();flush();shell();
  if(S.role=='owner')autoBackup()
}
async function refresh(){
  const [a,b,c]=await Promise.all([
    db.from('products').select('id,shop_id,name,barcode,unit,sale_price,sale_currency,stock_qty,min_stock,active').eq('active',true).order('name'),
    db.from('partners').select('*').order('name'),
    db.from('shops').select('*').eq('id',S.shop.id).single()]);
  if(a.error||b.error)return;
  S.prods=a.data||[];S.parts=b.data||[];if(c.data)S.shop=c.data;
  const cm={};
  if(can('costs')){const r=await db.rpc('product_costs',{p_shop:S.shop.id});(r.data||[]).forEach(x=>cm[x.id]=+x.avg_cost)}
  S.prods.forEach(p=>p.avg_cost=cm[p.id]||0);
  S.bom=[];
  if(can('mfg')){const bb=await db.from('bom_items').select('product_id,component_id,qty');S.bom=bb.data||[]}
  const [w,l]=await Promise.all([
    db.from('warehouses').select('id,name,is_default').order('created_at'),
    db.from('stock_levels').select('product_id,warehouse_id,qty')]);
  if(w.error||l.error)return;
  S.whs=w.data||[];S.lv={};
  (l.data||[]).forEach(x=>S.lv[x.product_id+'|'+x.warehouse_id]=+x.qty);
  if(!S.whs.find(x=>x.id==S.wh)){const sv=localStorage.wh;S.wh=(S.whs.find(x=>x.id==sv)||S.whs.find(x=>x.is_default)||S.whs[0]||{}).id||null}
  if(S.fixedWh&&S.whs.find(x=>x.id==S.fixedWh))S.wh=S.fixedWh;
  cashBar();saveCache()
}
function newShopView(){
  $('#app').innerHTML=`<main><div class=card><h3>أنشئ محلك</h3><input id=sn placeholder="اسم المحل">
  <button class=b onclick="mk()">إنشاء (تجربة 14 يوماً)</button></div>
  <div class=card><div class=m>إذا كنت كاشيراً: اطلب من المالك إضافة إيميلك، ثم اضغط تحديث.</div>
  <button class="b s" style="width:100%;margin-top:8px" onclick="load()">تحديث</button></div></main>`
}
async function mk(){const n=$('#sn').value.trim();if(!n)return;const r=await call('create_shop',{p_name:n});if(r!==undefined)load()}

/* ---- الهيكل ---- */
const TABS={sale:'بيع',buy:'شراء',hist:'الفواتير',prod:'المنتجات',debt:'الديون',rcv:'القبض والدفع',vch:'السندات',rep:'التقارير',stock:'المخزون',mfg:'التصنيع',acc:'الحسابات',team:'الفريق',co:'بيانات الشركة',bkp:'النسخ الاحتياطي',help:'الدليل',open:'افتتاحي'};
function shell(){
  const exp=new Date(S.shop.subscription_until)<new Date(new Date().toDateString());
  $('#app').innerHTML=`<header><div style="display:flex;gap:9px;align-items:center"><img src="icon-192.png" width=38 height=38 alt="" style="border-radius:10px"><div><b>${esc(S.shop.name)}</b><br><span class="m ${exp?'neg':''}">${exp?'انتهى الاشتراك':'الاشتراك حتى '+S.shop.subscription_until}</span></div></div>
  ${S.role=='owner'?`<button class="b s" onclick="setRate()">$ = ${fmt(S.shop.usd_rate)}</button>`:`<span class=m>$ = ${fmt(S.shop.usd_rate)}</span>`}
  <button class="b s" onclick="logout()">خروج</button></header><div id=cs style="display:none"></div>
  <div id=stk><nav>${Object.entries(TABS).filter(([k])=>k!='open'&&tabOk(k)).map(([k,v])=>`<button data-k=${k} onclick="go('${k}')">${v}</button>`).join('')}</nav><div id=cb onclick="cashBar(true)" title="اضغط للتحديث" style="display:none"></div></div><main id=v></main>
  <footer class=m style="text-align:center;padding:4px 12px 18px">${BRAND} · <a href="${waLink()}" target=_blank rel=noopener>واتساب <span dir=ltr>${WAV}</span></a><br><button class="b s ib" style="display:none;margin-top:8px" onclick="installApp()">📲 تثبيت التطبيق</button></footer>`;
  if(IP)document.querySelectorAll('.ib').forEach(b=>b.style.display='');
  go(tabOk(S.tab)?S.tab:(['sale','buy','hist','prod','help'].find(tabOk)));pqUpdate();cashBarDraw();cashBar(true)
}
function go(k){
  S.tab=k;
  if(S.edit&&k!==S.mode){S.edit=null;S.cart=[]}
  if(k=='sale'||k=='buy'||k=='open'){if(S.mode!==k)S.cart=[];S.mode=k}
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));
  ({sale:inv,buy:inv,hist:histV,team:teamV,stock:stockV,mfg:mfgV,acc:acctV,rcv:rcvV,vch:vchV,bkp:bkpV,co:coV,help:helpV,open:inv,prod:prodV,debt:debtV,rep:repV})[k]()
}
async function setRate(){
  const v=prompt('سعر الدولار بالليرة',S.shop.usd_rate);if(!v)return;
  const r=await call('set_usd_rate',{p_shop:S.shop.id,p_rate:+v});
  if(r!==undefined){await refresh();shell();toast('تم تحديث سعر الدولار')}
}

/* ---- فاتورة بيع / شراء ---- */
function inv(){
  const sale=S.mode=='sale',list=S.parts.filter(p=>p.kind==(sale?'customer':'supplier')||p.kind=='both');
  $('#v').innerHTML=`<div class=card><div class=row><input id=q placeholder="ابحث بالاسم أو امسح الباركود" oninput="srch()" onkeydown="if(event.key=='Enter')pickBar()"><button class="b s" style="flex:0;padding:10px 14px" onclick="scanInv()">📷</button></div><div id=res></div></div>
  <div class=card><div id=cart></div>
  ${S.fixedWh?`<div class=m>المستودع: ${esc((S.whs.find(w=>w.id==S.fixedWh)||{}).name||'')}</div>`:S.whs.length>1?`<select id=wh onchange="S.wh=this.value;localStorage.wh=S.wh;srch()">${S.whs.map(w=>`<option value=${w.id} ${w.id==S.wh?'selected':''}>${esc(w.name)}`).join('')}</select>`:''}
  <select id=cur onchange="setCur(this.value)"><option>SYP<option>USD</select>
  <div class=row><select id=pt onchange="pmCh()"><option value="">${sale?'بدون زبون (نقدي)':'اختر المورد (للآجل)'}${list.map(p=>`<option value=${p.id}>${esc(p.name)}`).join('')}</select><button id=np class="b s" style="flex:0;padding:10px 14px" onclick="newPartner()" title="إضافة ${sale?'زبون':'مورد'} جديد">＋</button></div>
  <select id=pm onchange="pmCh()"><option value=cash>الدفع: نقداً بالكامل<option value=credit>آجل (بدون دفعة)<option value=part>دفعة جزئية والباقي آجل</select>
  <input id=paid type=number inputmode=decimal placeholder="المبلغ المدفوع الآن" style="display:none">
  ${sale&&!S.edit?`<label class=m style="display:flex;gap:6px;align-items:center;margin:6px 0"><input type=checkbox id=ap style="width:auto;margin:0" ${localStorage.ap=='1'?'checked':''} onchange="localStorage.ap=this.checked?'1':'0'"> طباعة الوصل بعد البيع</label>`:''}
  <button class=b style="width:100%" onclick="post()">${sale?'تسجيل البيع':'تسجيل الشراء'}</button></div>`;
  $('#cur').value=S.cur;cartV();srch();
  if(S.edit){
    $('#pt').value=S.edit.partner||'';const e0=S.edit;$('#pm').value=+e0.paid>=+e0.total-0.005?'cash':(+e0.paid<=0?'credit':'part');if($('#pm').value=='part')$('#paid').value=e0.paid;pmCh();
    $('#v').insertAdjacentHTML('afterbegin',`<div class=card style="border-color:var(--p)"><b>تعديل فاتورة</b><div class=m>تُلغى الفاتورة القديمة وتُسجَّل هذه بدلاً منها بنفس التاريخ. عدّل البنود ثم اضغط التسجيل.</div><button class="b s" style="margin-top:6px" onclick="S.edit=null;S.cart=[];go('hist')">إلغاء التعديل</button></div>`)
  }
  if(S.mode=='open'){['#pt','#paid','#pm','#np'].forEach(q=>$(q).style.display='none');document.querySelector('button[onclick="post()"]').textContent='تسجيل المخزون الافتتاحي'}
}
function pmCh(){
  const pm=$('#pm').value;
  $('#paid').style.display=pm=='part'?'':'none';
  $('#pt').style.borderColor=(pm!='cash'&&!$('#pt').value)?'var(--r)':''
}
async function newPartner(){
  const sale=S.mode=='sale',n=prompt(sale?'اسم الزبون الجديد':'اسم المورد الجديد');if(!n||!n.trim())return;
  const ph=prompt('رقم الهاتف (اختياري)')||'';
  const {data,error}=await db.from('partners').insert({shop_id:S.shop.id,name:n.trim(),phone:ph.trim()||null,kind:sale?'customer':'supplier'}).select('id').single();
  if(error)return toast(error.message);
  const pmv=$('#pm').value,pv=$('#paid').value;

function add(id){
  const p=S.prods.find(x=>x.id==id),c=S.cart.find(x=>x.id==id);
  if(c){c.qty++;return cartV()}
  const base=S.mode=='sale'?p.sale_price*rate(p.sale_currency):+p.avg_cost;
  S.cart.push({id,name:p.name,qty:1,base,price:+(base/rate(S.cur)).toFixed(4)});cartV()
}
function setCur(c){S.cur=c;S.cart.forEach(i=>i.price=+(i.base/rate(c)).toFixed(4));cartV()}
const tot=()=>Math.round(S.cart.reduce((s,i)=>s+Math.round(i.qty*i.price*100)/100,0)*100)/100;
function cartV(){
  $('#cart').innerHTML=S.cart.map((i,k)=>`<div class=it><div style="flex:2">${esc(i.name)}</div>
  <input style="flex:1" type=number inputmode=decimal value="${i.qty}" onchange="S.cart[${k}].qty=+this.value;cartV()">
  <input style="flex:1.4" type=number inputmode=decimal value="${i.price}" onchange="S.cart[${k}].price=+this.value;cartV()">
  <button class="b s" style="flex:0" onclick="S.cart.splice(${k},1);cartV()">✕</button></div>`).join('')
  +`<h3>الإجمالي: ${fmt(tot())} ${S.cur}</h3>`
}
async function post(){
  if(!S.cart.length)return toast('الفاتورة فارغة');
  if(S.mode=='open')return postOpen();
  const sale=S.mode=='sale',t=tot(),pm=$('#pm').value;
  let paid=pm=='cash'?t:pm=='credit'?0:+$('#paid').value;
  if(pm=='part'&&!(paid>0&&paid<t))return toast('أدخل مبلغاً أكبر من صفر وأقل من إجمالي الفاتورة ('+fmt(t)+')');
  if(pm!='cash'&&!$('#pt').value){$('#pt').style.borderColor='var(--r)';return toast(sale?'البيع الآجل يحتاج اختيار الزبون، أو أضفه بزر ＋':'الشراء الآجل يحتاج اختيار المورد، أو أضفه بزر ＋')}
  if(sale&&!S.edit){
    const chk=()=>{for(const i of S.cart){const have=lvl(i.id,S.wh);if(i.qty>have){const h=whHint(i.id);return '"'+i.name+'": المطلوب '+fmt(i.qty)+' والمتوفر بهذا المستودع '+fmt(have)+(h?'. متوفر في: '+h+' (غيّر المستودع من القائمة)':'')}}return ''};
    let bad=chk();
    if(bad&&navigator.onLine){await refresh();bad=chk()}
    if(bad&&!confirm(bad+'\n\nسيصبح رصيد هذا المستودع بالسالب. هل تريد المتابعة؟'))return
  }
  const args={p_shop:S.shop.id,p_client:uid(),p_partner:$('#pt').value||null,p_currency:S.cur,p_rate:rate(S.cur),
    p_items:S.cart.map(i=>sale?{product_id:i.id,qty:i.qty,price:i.price}:{product_id:i.id,qty:i.qty,unit_cost:i.price}),p_paid:paid};
  if(S.edit){
    const e=S.edit;args.p_old=e.id;args.p_date=e.date;if(S.cur===e.cur)args.p_rate=e.rate;
    const r2=await call(sale?'edit_sale':'edit_purchase',args);
    if(r2===undefined)return;
    S.edit=null;S.cart=[];await refresh();toast('تم تعديل الفاتورة ✓');return go('hist')
  }
  args.p_wh=S.wh;
  const r=await call(sale?'post_sale_wh':'post_purchase_wh',args,true);
  if(r===undefined)return;
  const snapObj=sale?{kind:'sale',date:today(),currency:S.cur,total:t,paid,items:S.cart.map(i=>({n:i.name,q:i.qty,p:i.price})),partners:{name:$('#pt').value?$('#pt').selectedOptions[0].text:''}}:null;
  const auto=sale&&r&&$('#ap')&&$('#ap').checked;
  S.cart=[];
  if(r)await refresh();
  inv();
  if(r===null){
    showDone({t:sale?'تم حفظ فاتورة البيع':'تم حفظ فاتورة الشراء',b:'لا يوجد اتصال بالإنترنت الآن.<br>الفاتورة محفوظة على جهازك وستُرحَّل تلقائياً إلى النظام فور عودة الاتصال.<br><b>عمليات بانتظار الإرسال: '+qGet().length+'</b><br><span class=m style="color:inherit">لا تسجّل الخروج قبل ترحيلها.</span>'},snapObj)
  }else{
    toast('تم التسجيل ✓');
    if(auto)printObj(snapObj)
  }
}

  $('#v').innerHTML=`<div class=card><b>${esc(p.name)}</b> <span class=m>${KL(p.kind)}</span>${p.phone?`<div class=m dir=ltr style="text-align:right">${esc(p.phone)}</div>`:''}

  <button class="b s" style="width:100%;margin-top:8px" onclick="debtV()">رجوع</button></div><div class=card id=stm></div>`;

async function openBal(id){
  const p=S.parts.find(x=>x.id==id);let side=p.kind;
  if(side=='both')side=confirm('هذا الطرف زبون ومورد.\nموافق = رصيد لنا عليه (كزبون)\nإلغاء = رصيد له علينا (كمورد)')?'customer':'supplier';
  const a=prompt(side=='customer'?'الرصيد الافتتاحي: مبلغ مستحق لنا عليه':'الرصيد الافتتاحي: مبلغ مستحق علينا له');
  if(!a||isNaN(+a)||+a<=0)return;
  const cur=confirm('بالدولار؟ (موافق = دولار، إلغاء = ليرة)')?'USD':'SYP';
  const r=await call('post_opening_balance',{p_shop:S.shop.id,p_client:uid(),p_partner:id,p_side:side,p_amount:+a,p_currency:cur,p_rate:rate(cur)},true);

async function offsetP(id,max){
  if(!(max>0))return toast('لا يوجد رصيدان متقابلان للمقاصة (لا بد أن يكون له علينا ولنا عليه)');
  const a=prompt('مبلغ المقاصة بالليرة (حتى '+fmt(max)+')',max);if(!a||!(+a>0))return;
  const r=await call('post_offset',{p_shop:S.shop.id,p_client:uid(),p_partner:id,p_amount:+a});
  if(r!==undefined){toast('تمت المقاصة ✓');partnerV(id)}
}
async function editPartner(id){
  const p=S.parts.find(x=>x.id==id);
  const n=prompt('الاسم',p.name);if(!n||!n.trim())return;
  const ph=prompt('الهاتف',p.phone||'')||'';
  const k=prompt('النوع: 1 = زبون، 2 = مورد، 3 = زبون ومورد معاً',{customer:1,supplier:2,both:3}[p.kind]);
  if(!k||!['1','2','3'].includes(k.trim()))return;
  const kind={1:'customer',2:'supplier',3:'both'}[k.trim()];
  const {error}=await db.from('partners').update({name:n.trim(),phone:ph.trim()||null,kind}).eq('id',id);
  if(error)return toast(error.message);
  await refresh();toast('تم الحفظ ✓');partnerV(id)
}

function mfgPrev(){
  const id=$('#mp').value,q=+$('#mq').value||0,x=+$('#mx').value||0;
  let mat=0;
  const rows=S.bom.filter(b=>b.product_id==id).map(b=>{
    const p=S.prods.find(z=>z.id==b.component_id)||{},n=+b.qty*q,have=lvl(b.component_id,S.wh);
    mat+=n*(p.avg_cost||0);
    return `<div class=it><span>${esc(p.name)}</span><span class="${have<n?'neg':''}">${fmt(n)} / متوفر ${fmt(have)}</span></div>`});
  $('#mprev').innerHTML=rows.join('')+`<div class=it><span>تكلفة المواد</span><b>${fmt(mat)}</b></div>
  <div class=it><span>تكلفة الوحدة التقريبية</span><b>${q?fmt((mat+x)/q):'-'}</b></div>`
}
async function prodList(){
  const {data}=await db.from('production_orders').select('id,prod_date,qty,total_cost,voided_at,product_id').order('created_at',{ascending:false}).limit(10);
  const el=$('#pl');if(!el)return;
  el.innerHTML='<b>آخر أوامر التصنيع</b>'+((data||[]).map(o=>`<div class=it><span>${esc(pname(o.product_id))} × ${fmt(o.qty)}<br><span class=m>${o.prod_date} · التكلفة ${fmt(o.total_cost)}</span></span>${o.voided_at?'<span class="neg strike">ملغى</span>':`<button class="b s neg" style="flex:0" onclick="voidProd('${o.id}')">إلغاء</button>`}</div>`).join('')||'<div class=m>لا أوامر بعد</div>')
}
async function voidProd(id){
  if(!confirm('إلغاء أمر التصنيع؟ سترجع المواد الخام ويُسحب المنتج الجاهز من المستودع.'))return;
  const r=await call('void_production',{p_shop:S.shop.id,p_order:id});
  if(r!==undefined){await refresh();toast('تم إلغاء أمر التصنيع ✓');mfgV()}
}
async function doProd(){
  const id=$('#mp').value,q=+$('#mq').value;
  if(!id||!(q>0))return toast('اختر المنتج وأدخل الكمية');
  const r=await call('post_production',{p_wh:S.wh,p_shop:S.shop.id,p_client:uid(),p_product:id,p_qty:q,p_extra:+$('#mx').value||0});

function rcpLoad(){
  S.rc=S.bom.filter(b=>b.product_id==$('#rp').value).map(b=>({id:b.component_id,qty:+b.qty}));rcpDraw()
}
function rcpDraw(){
  $('#rc').innerHTML=S.rc.map((x,k)=>`<div class=it><span>${esc(pname(x.id))}</span><span>${fmt(x.qty)} <button class="b s" style="padding:4px 10px" onclick="S.rc.splice(${k},1);rcpDraw()">✕</button></span></div>`).join('')||'<div class=m>لا مكونات بعد</div>'
}
function rcpAdd(){
  const id=$('#rcs').value,q=+$('#rcq').value;

  $('#rcq').value='';rcpDraw()

async function rcpSave(){
  const r=await call('set_bom',{p_shop:S.shop.id,p_product:$('#rp').value,p_items:S.rc.map(x=>({component_id:x.id,qty:x.qty}))});

}

<li>اضغط <b>تسجيل البيع</b>. فعّل "طباعة الوصل بعد البيع" إذا تريد الطباعة تلقائياً.</li></ol>`},
{t:'📥 الشراء',o:1,h:`<ul>
<li>نفس خطوات البيع، لكن تُدخل <b>سعر التكلفة</b> لكل وحدة، وتختار <b>المورد</b> إذا كان الشراء آجلاً.</li>
<li>سعر التكلفة هو الذي يحدد ربحك، فتأكد منه. التكلفة تُحسب بمتوسط مرجح عند تكرار الشراء.</li></ul>`},
{t:'💳 الديون وكشف الحساب',o:1,h:`<ul>
<li>تبويب <b>الديون</b> يعرض الزبائن (كم عليهم) والموردين (كم علينا) والأطراف التي هي زبون ومورد معاً (رصيدان).</li>
<li>في كشف حساب الزبون أو المورد اختر <b>مختصر</b> (الحركات فقط) أو <b>تفصيلي (بالمواد)</b> لترى تحت كل فاتورة موادها وكمياتها وأسعارها وإجماليها والمدفوع منها، ويمكنك طباعة أي منهما.</li>
<li>اضغط على الاسم: ترى كشف الحساب (بفترة من/إلى وطباعة)، وتسجّل <b>سند قبض</b> من الزبون أو <b>سند دفع</b> للمورد، أو <b>رصيد افتتاحي</b> لدين قديم.</li></ul>`},
{t:'🧾 الفواتير',o:0,h:`<ul>
<li>تبويب <b>الفواتير</b> يعرض آخر الفواتير. اضغط على فاتورة لترى تفاصيلها ولطباعتها مجدداً.</li>
<li><b>المالك فقط:</b> زر <b>تعديل</b> يفتح الفاتورة للتعديل (تُلغى القديمة وتُسجَّل الجديدة تلقائياً)، وزر <b>إلغاء</b> يعكس الفاتورة ويعيد المخزون.</li>
<li>الفاتورة الملغاة تبقى ظاهرة مشطوبة حفاظاً على السجل. تعديل أو إلغاء فاتورة شراء يُرفض إذا بِعتَ جزءاً من بضاعتها.</li></ul>`},
{t:'🏬 المخزون والمستودعات',o:1,h:`<ul>
<li>من تبويب <b>المخزون</b>: اختر المستودع الحالي، أضف مستودعاً جديداً، أو حوّل بضاعة بين مستودعين.</li>
<li><b>الجرد:</b> اضغط على المنتج وأدخل الكمية الفعلية الموجودة، فيسوّي البرنامج الفرق ويسجّله كخسارة أو ربح جرد.</li>
<li><b>مخزون افتتاحي:</b> لتسجيل بضاعة موجودة مسبقاً بدون التأثير على الصندوق. استخدمه مرة واحدة لكل منتج.</li>
<li>الفواتير تُسجَّل على المستودع المختار. إذا بِعتَ من مستودع رصيده أقل يظهر رصيده بالسالب تنبيهاً: صحّحه بالتحويل أو اختر المستودع الصحيح.</li></ul>`},
{t:'📊 التقارير',o:1,h:`<ul>
<li>الملخص: الصندوق، ذمم الزبائن، قيمة المخزون، ذمم الموردين، المبيعات، وصافي الربح.</li>
<li><b>تقرير الفترة:</b> اليوم، 7 أيام، 30 يوماً، أو من تاريخ إلى تاريخ.</li>
<li>المصاريف والسندات وتصريف الدولار من تبويب <b>السندات</b>، والنسخ الاحتياطي من تبويبه المستقل.</li>
</ul>`},
{t:'🏭 التصنيع',o:1,h:`<ol>
<li>عرّف المواد الخام والمنتج الجاهز في تبويب المنتجات، وسجّل مخزون المواد الخام.</li>
<li>من تبويب <b>التصنيع</b> اكتب <b>الوصفة</b>: المواد اللازمة لوحدة واحدة من المنتج الجاهز.</li>
<li>لتنفيذ التصنيع: اختر المنتج والكمية، وأضف مصاريف إضافية (أجور، كهرباء) إن وجدت، ثم <b>تنفيذ</b>. تُخصم المواد ويُضاف المنتج بتكلفته الحقيقية.</li>
<li>يمكن إلغاء أمر التصنيع إذا لم يُبَع أو يُستهلك جزء من المنتج الجاهز.</li></ol>`},
{t:'📒 الحسابات (للمحاسبين)',o:1,h:`<ul>
<li>تبويب <b>الحسابات</b> يعرض شجرة الحسابات. اضغط على أي حساب (أو صندوق) لترى كشف حسابه بفترة من/إلى مع الطباعة.</li>
<li>يمكنك إضافة حساب تحت مجموعة، وإنشاء صناديق إضافية والتحويل بينها، وتسجيل سند أو قيد بين حسابين، واستيراد دليل حسابات جاهز.</li>
<li>لا تعدّل الشجرة إلا إذا كنت تعرف المحاسبة. حسابات البرنامج الأساسية (الصندوق، الزبائن، المخزون، المبيعات...) تستطيع تغيير اسمها ورقمها بأمان.</li></ul>`},
{t:'💰 القبض من الزبائن والدفع للموردين',o:1,h:`<ul>
<li>تبويب <b>القبض والدفع</b>: اختر <b>قبض من زبون</b> أو <b>دفع لمورد</b>، ثم الطرف. يظهر لك دينه بالليرة وبالدولار.</li>
<li>اكتب المبلغ واختر <b>عملة الدفع</b>، ثم اختر <b>عملة الدين</b> التي تريد تسديدها. يمكنك أن تقبض بعملة مختلفة عن عملة دين الزبون، أو تدفع بعملة مختلفة عن عملة دين المورد.</li>
<li>عند اختلاف العملة اكتب <b>سعر الصرف المتفق عليه</b>، وسيعرض البرنامج كم سيُسدَّد من الدين قبل الحفظ. مثال: زبون عليه 100 دولار دفع 1,200,000 ليرة بسعر 12,000 فيُسدَّد 100 دولار.</li>
<li>إذا تغيّر السعر عمّا سُجّل به الدين، يُسجَّل الفرق تلقائياً في حساب <b>فروقات صرف</b> (ربح أو خسارة)، ويُغلق الدين بدقة بدون باقٍ عالق.</li>
<li>في القائمة تحتها: 🖨 لطباعة السند، و<b>إلغاء</b> لعكسه ويعود رصيد الطرف كما كان.</li></ul>`},
{t:'🧾 السندات الأخرى (مصروف وتصريف)',o:1,h:`<ul>
<li>تبويب <b>السندات</b> للمصروفات وتصريف الدولار (شراء أو بيع الدولار بالليرة، يحرّك صندوق الليرة وصندوق الدولار معاً)، مع قائمة آخر السندات للطباعة أو الإلغاء.</li>
<li><b>الزبون والمورد معاً:</b> عند إضافة الطرف اختر "زبون ومورد معاً" (أو غيّر نوعه من صفحته بزر تعديل). يظهر في البيع والشراء، ويقبل منه ويدفع له، وله رصيدان: لنا عليه وله علينا. ولتسوية الرصيدين ببعضهما اضغط <b>مقاصة</b> من صفحته.</li></ul>`},
{t:'💵 صندوق الدولار',o:1,h:`<ul>
<li>للدولار صندوق مستقل اسمه <b>صندوق الدولار</b>. كل فاتورة نقدية بالدولار، وسند قبض أو دفع أو مصروف بالدولار، يدخل إليه أو يخرج منه تلقائياً. والعمليات بالليرة تمرّ على صندوق الليرة.</li>
<li>رصيده يظهر <b>بالدولار</b> وبما يعادله بالليرة (حسب سعر كل عملية) في تبويب الحسابات وفي التقارير، وكشف حسابه بالدولار مع طباعة.</li>
<li>لشراء أو بيع الدولار بالليرة استخدم <b>تصريف دولار</b> من تبويب السندات: يحرّك الصندوقين معاً.</li>
<li>الدفاتر تبقى بالليرة، فلا تنسَ تحديث سعر الدولار (زر $ أعلى الصفحة).</li>
<li><b>شريط أرصدة الصناديق</b> ثابت تحت التبويبات في كل الشاشات (لمن لديه صلاحية السندات أو التقارير أو الحسابات). يتحدّث بعد كل عملية، واضغط عليه لتحديثه يدوياً. بدون إنترنت أو مع عمليات معلّقة ينبّهك أن الأرصدة غير محدّثة.</li></ul>`},
{t:'🏢 بيانات الشركة',o:1,h:`<ul>
<li>من تبويب <b>بيانات الشركة</b> (للمالك) اكتب العنوان وأرقام الهاتف وملاحظة اختيارية.</li>
<li>تظهر أعلى الفواتير والسندات وكشوف الحساب عند الطباعة، والملاحظة أسفلها.</li>
<li><b>البدء من الصفر:</b> من نفس التبويب زر <b>تصفير الشركة</b> يحذف كل العمليات (ويمكنك الاحتفاظ بقوائم المنتجات والزبائن والموردين)، ويحفظ قبله نسخة أمان تتراجع منها. وزر <b>حذف الشركة نهائياً</b> يحذف كل شيء بلا تراجع. نزّل نسخة على جهازك قبل أيٍّ منهما.</li></ul>`},
{t:'🛡️ النسخ الاحتياطي والاسترجاع',o:1,h:`<ul>
<li>تبويب <b>النسخ الاحتياطي</b> (للمالك): نسخ تلقائية يومياً، ونسخة الآن، وتنزيل أي نسخة كملف على جهازك، واسترجاع من نسخة محفوظة أو من ملف.</li>
<li>قبل أي استرجاع يحفظ البرنامج نسخة بحالتك الحالية لتتراجع إن أردت.</li>
<li>نزّل نسخة على جهازك كل أسبوع، فالنسخ المحفوظة داخل النظام لا تغني عن نسخة خارجه.</li></ul>`},
{t:'👥 المستخدمون والصلاحيات',o:1,h:`<ul>
<li>من تبويب <b>الفريق</b> (للمالك): المستخدم ينشئ حساباً بإيميله من شاشة الدخول (زر "حساب جديد")، ثم تكتب إيميله وتضيفه.</li>
<li>اختر صلاحياته بالمربعات أو بقالب جاهز (كاشير، أمين مستودع، محاسب، مدير). الصلاحيات: البيع، رؤية كل الفواتير، تعديل وإلغاء الفواتير، الشراء، إدارة المنتجات، رؤية التكلفة، المخزون، السندات والديون، التقارير والأرباح، الحسابات، التصنيع.</li>
<li>تظهر لكل مستخدم التبويبات المسموحة له فقط، والمنع مطبّق من قاعدة البيانات نفسها. الفريق والنسخ الاحتياطي وبيانات الشركة للمالك وحده.</li>
<li>لتثبيت مبيعات مستخدم على مستودع معين اختر مستودعه من نفس الشاشة. للتعديل لاحقاً افتح "الصلاحيات" تحت اسمه ثم احفظ.</li></ul>`},
{t:'📶 العمل بدون إنترنت وتثبيت التطبيق',o:0,h:`<ul>
<li>إذا انقطع الإنترنت يظهر شريط أصفر أعلى الصفحة. تتابع البيع والشراء كالمعتاد، وتظهر رسالة تؤكد أن الفاتورة <b>حُفظت على جهازك وستُرحَّل تلقائياً عند عودة الاتصال</b> (ويمكنك طباعة الوصل). تجد العمليات المنتظرة في تبويب الفواتير.</li>
<li><b>لا تسجّل الخروج</b> قبل أن تُرحَّل العمليات المنتظرة. وبقية الشاشات (التقارير، الحسابات...) تحتاج اتصالاً.</li>
<li><b>للتثبيت كتطبيق:</b> افتح الموقع من Chrome، واضغط زر <b>📲 تثبيت التطبيق</b> أسفل الصفحة إن ظهر، أو النقاط الثلاث ثم <b>تثبيت التطبيق</b>. على الآيفون: Safari ← مشاركة ← إضافة إلى الشاشة الرئيسية.</li>
<li>إذا لم يظهر خيار التثبيت اضغط <b>فحص التثبيت</b> في آخر هذه الصفحة ليخبرك ما الناقص.</li>
<li>مسح الباركود بالكاميرا يطلب إذن الكاميرا أول مرة، ويحتاج إنترنت مرة واحدة لتحميله.</li></ul>`},
{t:'💾 النسخ الاحتياطي والاسترجاع',o:1,h:`<ul>
<li>يأخذ البرنامج <b>نسخة تلقائية يومياً</b> عند فتحك له، ويحتفظ بآخر 7 نسخ. وتجدها في <b>التقارير ← النسخ الاحتياطي والاسترجاع</b>.</li>
<li><b>إنشاء نسخة الآن</b> قبل أي عملية كبيرة، و<b>تنزيل على جهازي</b> لتحتفظ بملف خارج النظام (افعلها كل أسبوع).</li>
<li><b>الاسترجاع:</b> اضغط "استرجاع" بجانب النسخة، أو اختر ملفاً محفوظاً. يستبدل كل بيانات المحل ببيانات النسخة، وكل ما سُجّل بعدها يُحذف. قبل الاسترجاع يأخذ البرنامج نسخة أمان تظهر بالقائمة، فتستطيع التراجع.</li>
<li>أوقف الكاشير عن العمل أثناء الاسترجاع، وانتظر ترحيل أي عمليات بانتظار الإرسال قبله.</li></ul>`},
{t:'🛡️ نصائح مهمة (للمالك)',o:1,h:`<ul>
<li>نزّل <b>نسخة احتياطية</b> كل أسبوع (التقارير).</li>
<li>أنشئ للكاشير حساباً خاصاً ولا تعطه حسابك.</li>
<li>راجع صندوقك وجرد بضاعتك دورياً وقارنهما بالواقع.</li>
<li>بعد انتهاء الاشتراك تبقى بياناتك ظاهرة، لكن لا يمكن تسجيل عمليات جديدة حتى التجديد. تواصل معنا للتجديد.</li></ul>`},
{t:'❓ مشاكل شائعة وحلولها',o:0,h:`<ul>
<li><b>"الكمية غير كافية":</b> الكمية الإجمالية للمنتج ناقصة. سجّل شراءً أو اعمل جرداً (للمالك).</li>
<li><b>البيع الآجل يرفض:</b> اختر الزبون أو أضفه بزر ＋.</li>
<li><b>"انتهى الاشتراك":</b> تواصل معنا عبر واتساب للتجديد.</li>
<li><b>لا يظهر المنتج بالبحث:</b> تأكد أنه غير محذوف وأن الاسم أو الباركود صحيح.</li>
<li><b>الكاميرا لا تفتح:</b> اسمح للموقع باستخدام الكاميرا من إعدادات المتصفح، وجرّب إضاءة أفضل وتقريب الباركود.</li>
<li><b>ظهرت رسالة خطأ غريبة:</b> صوّرها وأرسلها لنا عبر واتساب.</li></ul>`}
];

const PRESETS={'كاشير':['sell'],'أمين مستودع':['purchase','products','stock'],'محاسب':['invoices','vouchers','reports','accounts','costs'],'مدير':PERMS.map(p=>p[0])};
const permBoxes=(pre,sel)=>PERMS.map(([k,l])=>`<label class=m style="display:flex;gap:8px;align-items:center;margin:5px 0"><input type=checkbox class="${pre}" value="${k}" style="width:auto;margin:0" ${sel.includes(k)?'checked':''}> ${l}</label>`).join('');
const permSel=pre=>[...document.querySelectorAll('.'+pre+':checked')].map(x=>x.value);
const presetBtns=pre=>Object.keys(PRESETS).map(n=>`<button class="b s" style="padding:6px 10px" onclick="applyPreset('${pre}','${n}')">${n}</button>`).join(' ');
function applyPreset(pre,name){const p=PRESETS[name]||[];document.querySelectorAll('.'+pre).forEach(x=>x.checked=p.includes(x.value))}

async function loadPeriod(n,from,to){

  <div class=m>${from} ← ${to} · بالليرة</div>`
}
async function all(t,cols='*',ord=['id']){
  let o=[],i=0;
  for(;;){
    let q=db.from(t).select(cols);ord.forEach(c=>q=q.order(c));
    const {data,error}=await q.range(i,i+999);
    if(error)throw new Error(t+': '+error.message);
    o=o.concat(data);if(data.length<1000)return o;i+=1000
  }
}
const saveJson=(obj,name)=>{

  return {url,kb:Math.round(blob.size/1024)}
};

async function bkFile(inp){
  const f=inp.files[0];if(!f)return;
  let d;try{d=JSON.parse(await f.text())}catch(e){inp.value='';return toast('الملف غير صالح')}
  if(d&&d.version===1&&d.tables){if(bkAsk('الملف '+f.name))bkRun('restore_from_json',{p_shop:S.shop.id,p_data:d,p_confirm:'استرجاع'})}
  else toast('هذا الملف ليس بصيغة النسخ الجديدة. نزّل نسخة جديدة من هنا ثم استرجع منها.');
  inp.value=''
}
/* ---- ماسح الباركود بالكاميرا ---- */
let H5,SC=null;
function loadH5(){
  return H5||(H5=new Promise((ok,no)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
    s.onload=ok;s.onerror=()=>{H5=null;no()};document.head.appendChild(s)
  }))
}
async function scan(onCode,hint){
  try{await loadH5()}catch(e){return toast('تعذّر تحميل ماسح الباركود. تحقق من الإنترنت')}
  $('#scan').style.display='flex';$('#sh').textContent=hint||'وجّه الكاميرا نحو الباركود';
  SC=new Html5Qrcode('reader');
  const F=Html5QrcodeSupportedFormats;let last='',t=0;
  try{
    await SC.start({facingMode:'environment'},
      {fps:10,qrbox:{width:280,height:140},formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.QR_CODE]},
      txt=>{const n=Date.now();if(txt===last&&n-t<2000)return;last=txt;t=n;onCode(txt.trim())},()=>{})
  }catch(e){closeScan();toast('تعذّر فتح الكاميرا. اسمح للموقع باستخدام الكاميرا من إعدادات المتصفح')}
}
async function closeScan(){
  $('#scan').style.display='none';
  if(SC){try{await SC.stop()}catch(e){}try{SC.clear()}catch(e){}SC=null}
}
function scanTo(id){scan(txt=>{$('#'+id).value=txt;closeScan()},'امسح باركود المنتج')}
function scanInv(){
  scan(txt=>{
    const p=S.prods.find(x=>x.barcode===txt);
    if(!p)return toast('باركود غير معروف: '+txt);
    add(p.id);toast('أُضيف: '+p.name);if(navigator.vibrate)navigator.vibrate(60)
  },'امسح المنتجات تباعاً، واضغط إغلاق عند الانتهاء')
}
/* ---- بيانات الشركة ---- */
const coHdr=()=>`<h3 style="text-align:center;margin:0">${esc(S.shop.name)}</h3>${S.shop.address?`<div style="text-align:center;font-size:11px">${esc(S.shop.address)}</div>`:''}${S.shop.phones?`<div style="text-align:center;font-size:11px" dir=ltr>${esc(S.shop.phones)}</div>`:''}`;
const coFtr=()=>S.shop.invoice_note?`<hr><div style="text-align:center">${esc(S.shop.invoice_note)}</div>`:'';
function coV(){
  const s=S.shop;
  $('#v').innerHTML=`<div class=card><b>بيانات الشركة</b><div class=m>تظهر أعلى الفواتير والسندات وكشوف الحساب عند الطباعة.</div>
  <div class=m style="margin-top:8px">العنوان</div><input id=cad value="${esc(s.address||'')}" placeholder="مثال: حلب - الجميلية - شارع ...">
  <div class=m>أرقام الهاتف (يمكنك كتابة أكثر من رقم)</div><input id=cph dir=ltr value="${esc(s.phones||'')}" placeholder="0933 000 000 - 021 000 0000">
  <div class=m>ملاحظة أسفل الفاتورة (اختياري)</div><input id=cnt value="${esc(s.invoice_note||'')}" placeholder="مثال: شكراً لتعاملكم معنا">
  <button class=b style="width:100%;margin-top:8px" onclick="saveCo()">حفظ</button></div>
  <div class=card><b>معاينة رأس الفاتورة</b><div style="padding:10px 0">${coHdr()}</div>${coFtr()}</div>
  <div class=card style="border-color:var(--r)"><b class=neg>⚠️ البدء من الصفر أو حذف الشركة</b>
  <div class=m style="margin:6px 0">نزّل نسخة على جهازك أولاً. التصفير يحفظ نسخة أمان تتراجع منها، أما الحذف فنهائي.</div>
  <button class="b s" style="width:100%" onclick="backup()">تنزيل نسخة على جهازك أولاً</button>
  <label class=m style="display:flex;gap:8px;align-items:center;margin:10px 0 6px"><input type=checkbox id=kc checked style="width:auto;margin:0"> الاحتفاظ بقوائم المنتجات والزبائن والموردين (تصفير العمليات والأرصدة فقط)</label>
  <button class="b s neg" style="width:100%" onclick="resetCo()">تصفير الشركة (البدء من الصفر)</button>
  <button class="b s neg" style="width:100%;margin-top:8px" onclick="delCo()">حذف الشركة نهائياً</button>
  <div id=bk class=m style="margin-top:6px"></div></div>`
}
/* ---- تصفير الشركة وحذفها ---- */
const pendingOps=()=>JSON.parse(localStorage.q||'[]').length;
async function resetCo(){
  if(pendingOps())return toast('عندك عمليات معلّقة لم تُرحَّل بعد. انتظر ترحيلها ثم أعد المحاولة.');
  const keep=$('#kc').checked;
  if(!confirm('سيتم حذف كل الفواتير والسندات والقيود وحركات المخزون'+(keep?'، وتصفير كميات المنتجات وأرصدة الزبائن والموردين، مع الاحتفاظ بقوائم المنتجات والزبائن والموردين.':'، وكل المنتجات والزبائن والموردين والمستودعات الإضافية.')+'\n\nتبقى شجرة الحسابات وبيانات الشركة والفريق والاشتراك.\nيُحفظ قبلها نسخة أمان ترجع منها من تبويب النسخ الاحتياطي.\n\nهل تريد المتابعة؟'))return;
  const w=prompt('للتأكيد اكتب كلمة: تصفير');if(w===null)return;
  const r=await call('reset_shop',{p_shop:S.shop.id,p_keep_catalog:keep,p_confirm:w.trim()});
  if(r===undefined)return;
  localStorage.removeItem('f');S.cart=[];
  await refresh();toast('تم تصفير الشركة ✓ (للتراجع: النسخ الاحتياطي ← نسخة الأمان)');go('sale')
}
async function delCo(){
  if(pendingOps())return toast('عندك عمليات معلّقة لم تُرحَّل بعد. انتظر ترحيلها أولاً.');
  const n=prompt('⚠️ حذف نهائي: يُحذف ملف الشركة بكل بياناته ونسخه الاحتياطية وفريقه، ولا يمكن التراجع.\nنزّل نسخة على جهازك قبل ذلك.\n\nللتأكيد اكتب اسم الشركة بالضبط:\n'+S.shop.name);
  if(n===null)return;
  const r=await call('delete_shop',{p_shop:S.shop.id,p_confirm:n.trim()});
  if(r===undefined)return;
  ['q','f','cache','wh'].forEach(k=>localStorage.removeItem(k));
  alert('تم حذف الشركة نهائياً.');location.reload()
}

async function saveCo(){
  const r=await call('set_shop_info',{p_shop:S.shop.id,p_address:$('#cad').value,p_phones:$('#cph').value,p_note:$('#cnt').value});
  if(r!==undefined){await refresh();toast('تم الحفظ ✓');coV()}
}

/* ---- النسخ الاحتياطي (تبويب مستقل) ---- */
function bkpV(){$('#v').innerHTML='<div class=card id=bkc></div>';bkCard()}

/* ---- القبض من الزبائن والدفع للموردين ---- */
async function rcvV(){
  S.rk=S.rk||'receipt';
  const {data}=await db.from('partner_cur_balances').select('*');
  S.pcb={};(data||[]).forEach(x=>S.pcb[x.partner_id]=x);
  $('#v').innerHTML=`<div class=card><div class=row><button class="b ${S.rk=='receipt'?'':'s'}" onclick="rcvKind('receipt')">قبض من زبون</button><button class="b ${S.rk=='payment'?'':'s'}" onclick="rcvKind('payment')">دفع لمورد</button></div><div id=rf style="margin-top:8px"></div></div><div class=card id=rl></div>`;
  rcvForm();rcvLoad()
}
function rcvKind(k){S.rk=k;S.rp=null;rcvV()}
function rcvGo(id,k){S.rk=k;S.rp=id;go('rcv')}
function rcvForm(){
  const rc=S.rk=='receipt';
  const L=S.parts.filter(p=>p.kind=='both'||p.kind==(rc?'customer':'supplier'));
  const sel=S.rp&&L.find(p=>p.id==S.rp)?S.rp:'';
  $('#rf').innerHTML=`<select id=rp onchange="rcvPick()"><option value="">${rc?'اختر الزبون':'اختر المورد'}${L.map(p=>`<option value=${p.id} ${p.id==sel?'selected':''}>${esc(p.name)}${p.kind=='both'?' (زبون ومورد)':''}`).join('')}</select>
  <div id=rb class=m style="margin:2px 0 6px"></div>
  <div class=m>${rc?'المبلغ المقبوض وعملته':'المبلغ المدفوع وعملته'}</div>
  <div class=row><input id=ra type=number inputmode=decimal placeholder="المبلغ" oninput="rcvCalc()"><select id=rpc onchange="rcvCalc()"><option value=SYP>ليرة<option value=USD>دولار</select></div>
  <div class=m>${rc?'يُسدَّد من دين الزبون بعملة':'يُسدَّد من دين المورد بعملة'}</div>
  <select id=rdc onchange="rcvCalc()"><option value=SYP>ليرة<option value=USD>دولار</select>
  <div id=rx style="display:none"><div class=m>سعر الصرف المتفق عليه (ليرة لكل دولار)</div><input id=rr type=number inputmode=decimal value="${S.shop.usd_rate}" oninput="rcvCalc()"></div>
  <div id=ri class=m style="margin:6px 0;color:var(--t)"></div>
  <button class=b style="width:100%" onclick="rcvSave()">${rc?'حفظ سند القبض':'حفظ سند الدفع'}</button>
  <div class=m style="margin-top:6px">يمكنك القبض أو الدفع بعملة مختلفة عن عملة الدين (مثلاً دين بالدولار يُسدَّد بالليرة). أي فرق بسبب تغيّر السعر يُسجَّل تلقائياً في حساب "فروقات صرف".</div>`;
  rcvPick()
}
function rcvPick(){
  const id=$('#rp').value,b=(S.pcb||{})[id],rc=S.rk=='receipt';
  if(!id){$('#rb').textContent='';rcvCalc();return}
  const syp=b?+(rc?b.rec_syp:b.pay_syp):0,usd=b?+(rc?b.rec_usd:b.pay_usd):0;
  $('#rb').innerHTML=(rc?'ديونه لنا: ':'ديونه علينا: ')+(syp||!usd?fmt(syp)+' ل.س':'')+(syp&&usd?' + ':'')+(usd?'$'+fmt(usd):'');
  const dc=usd>0&&syp<=0?'USD':'SYP';$('#rdc').value=dc;$('#rpc').value=dc;rcvCalc()
}
function rcvCalc(){
  const a=+$('#ra').value||0,pc=$('#rpc').value,dc=$('#rdc').value,r=+$('#rr').value||0;
  $('#rx').style.display=(pc=='USD'||dc=='USD')?'':'none';
  let t='';
  if(a>0){
    if(pc==dc)t='سيُسدَّد من الدين: '+(dc=='USD'?'$'+fmt(a):fmt(a)+' ل.س');
    else if(!(r>0))t='أدخل سعر الصرف';
    else{const d=pc=='SYP'?a/r:a*r;t='سيُسدَّد من الدين: '+(dc=='USD'?'$'+fmt(d):fmt(d)+' ل.س')}
    if(pc=='USD'&&r>0)t+=' · قيمة المقبوض بالليرة '+fmt(a*r)+' ل.س'
  }
  $('#ri').textContent=t
}
async function rcvSave(){
  const id=$('#rp').value,a=+$('#ra').value,pc=$('#rpc').value,dc=$('#rdc').value,r=+$('#rr').value,fx=pc=='USD'||dc=='USD';
  if(!id)return toast('اختر الطرف');
  if(!(a>0))return toast('أدخل المبلغ');
  if(fx&&!(r>0))return toast('أدخل سعر الصرف');
  const res=await call('post_settlement',{p_shop:S.shop.id,p_client:uid(),p_partner:id,p_kind:S.rk,p_amount:a,p_pay_cur:pc,p_debt_cur:dc,p_rate:fx?r:1},true);
  if(res===undefined)return;
  toast(res?'تم حفظ السند ✓':'لا يوجد اتصال: حُفظ وسيُرسل تلقائياً');
  S.rp=null;rcvV()
}
async function rcvLoad(){
  const {data,error}=await db.rpc('recent_vouchers',{p_shop:S.shop.id,p_types:['receipt','payment']});
  const el=$('#rl');if(!el)return;
  if(error){el.innerHTML='<b>آخر السندات</b><div class=m>'+esc(error.message)+'</div>';return}
  S.rl=data||[];
  el.innerHTML='<b>آخر سندات القبض والدفع</b>'+(S.rl.map((v,k)=>{const u=v.currency=='USD'&&v.foreign_amount;
    return `<div class=it><span>${VT[v.ref_type]||v.ref_type} · ${v.entry_date}<br><span class=m>${esc(v.partner_name||'')}</span><br><span class=m>${esc(v.description||'')}</span></span><span style="text-align:end"><b class="${v.voided?'strike neg':''}">${u?'$'+fmt(v.foreign_amount):fmt(v.amount)}</b>${u?`<br><span class=m>${fmt(v.amount)} ل.س</span>`:''}<br><button class="b s" style="padding:4px 10px" onclick="rcvPrint(${k})">🖨</button> ${v.voided?'':`<button class="b s neg" style="padding:4px 10px" onclick="rcvVoid('${v.id}')">إلغاء</button>`}</span></div>`}).join('')||'<div class=m>لا سندات بعد</div>')
}
function rcvPrint(k){S.vl=S.rl;vchPrint(k)}
async function rcvVoid(id){
  if(!confirm('إلغاء هذا السند؟ سيُسجَّل قيد عكسي ويعود رصيد الطرف كما كان.'))return;
  const r=await call('void_voucher',{p_shop:S.shop.id,p_entry:id});
  if(r!==undefined){toast('تم إلغاء السند ✓');rcvV()}
}

/* ---- السندات: مصروف وتصريف ---- */
const VT={receipt:'سند قبض',payment:'سند دفع',expense:'مصروف',offset:'مقاصة',exchange:'تصريف عملة',equity:'رأس مال / سحب'};
async function vchV(){
  $('#v').innerHTML=`<div class=card><b>سند جديد</b>
  <select id=vk onchange="vchForm()"><option value=expense>مصروف<option value=exchange>تصريف دولار</select>
  <div id=vf></div></div>
  ${can('accounts')?`<div class=card><div class=row><button class="b s" onclick="equity('deposit')">+ رأس مال</button><button class="b s" onclick="equity('withdraw')">سحب المالك</button></div></div>`:''}
  <div class=card id=vl2><div class=m>جارٍ التحميل...</div></div>`;
  vchForm();vchLoad()
}
function vchGo(k){go('vch');setTimeout(()=>{if($('#vk')){$('#vk').value=k;vchForm()}},0)}
function vchForm(){
  const k=$('#vk').value;let h='';
  if(k=='receipt'||k=='payment'){
    const L=S.parts.filter(p=>p.kind=='both'||p.kind==(k=='receipt'?'customer':'supplier'));
    h=`<select id=vp><option value="">اختر ${k=='receipt'?'الزبون':'المورد'}${L.map(p=>`<option value=${p.id}>${esc(p.name)}${p.kind=='both'?' (زبون ومورد)':''}`).join('')}</select>
    <div class=row><input id=va type=number inputmode=decimal placeholder="المبلغ"><select id=vcu><option>SYP<option>USD</select></div>`
  }else if(k=='expense'){
    h=`<input id=vn placeholder="البيان (مثال: إيجار، كهرباء)"><div class=row><input id=va type=number inputmode=decimal placeholder="المبلغ"><select id=vcu><option>SYP<option>USD</select></div>`
  }else{
    h=`<select id=vdir><option value=buy>شراء دولار بالليرة<option value=sell>بيع دولار بالليرة</select>
    <input id=va type=number inputmode=decimal placeholder="المبلغ بالدولار">
    <input id=vr type=number inputmode=decimal value="${S.shop.usd_rate}" placeholder="سعر الصرف (ليرة لكل دولار)">
    <div class=m>يحرّك صندوق الليرة وصندوق الدولار معاً.</div>`
  }
  $('#vf').innerHTML=h+`<button class=b style="width:100%;margin-top:6px" onclick="vchSave()">حفظ السند</button>${k=='exchange'?'':'<div class=m>السند بالدولار يمرّ تلقائياً على صندوق الدولار، وبالليرة على صندوق الليرة.</div>'}`
}
async function vchSave(){
  const k=$('#vk').value,a=+$('#va').value;
  if(!(a>0))return toast('أدخل المبلغ');
  let r;
  if(k=='exchange'){
    const rt=+$('#vr').value;if(!(rt>0))return toast('أدخل سعر الصرف');
    r=await call('post_exchange',{p_shop:S.shop.id,p_client:uid(),p_direction:$('#vdir').value,p_usd:a,p_rate:rt},true)
  }else if(k=='expense'){
    const cu=$('#vcu').value;
    r=await call('record_expense',{p_shop:S.shop.id,p_client:uid(),p_amount:a,p_currency:cu,p_rate:rate(cu),p_desc:$('#vn').value.trim()||'مصروف'},true)
  }else{
    const p=$('#vp').value;if(!p)return toast('اختر الطرف');
    const cu=$('#vcu').value;
    r=await call('record_payment',{p_shop:S.shop.id,p_client:uid(),p_partner:p,p_kind:k,p_amount:a,p_currency:cu,p_rate:rate(cu)},true)
  }
  if(r===undefined)return;
  toast(r?'تم حفظ السند ✓':'لا يوجد اتصال: حُفظ وسيُرسل تلقائياً');
  vchForm();vchLoad()
}
async function vchLoad(){
  const {data,error}=await db.rpc('recent_vouchers',{p_shop:S.shop.id,p_types:['expense','exchange','offset','equity']});
  const el=$('#vl2');if(!el)return;
  if(error){el.innerHTML='<b>آخر السندات</b><div class=m>'+esc(error.message)+'</div>';return}
  S.vl=data||[];
  el.innerHTML='<b>آخر السندات</b>'+(S.vl.map((v,k)=>{const u=v.currency=='USD'&&v.foreign_amount;
    return `<div class=it><span>${VT[v.ref_type]||v.ref_type} · ${v.entry_date}<br><span class=m>${esc(v.partner_name||v.description||'')}</span></span><span style="text-align:end"><b class="${v.voided?'strike neg':''}">${u?'$'+fmt(v.foreign_amount):fmt(v.amount)}</b>${u?`<br><span class=m>${fmt(v.amount)} ل.س</span>`:''}<br>${['receipt','payment','expense'].includes(v.ref_type)?`<button class="b s" style="padding:4px 10px" onclick="vchPrint(${k})">🖨</button> `:''}${v.voided?'':`<button class="b s neg" style="padding:4px 10px" onclick="voidV('${v.id}')">إلغاء</button>`}</span></div>`}).join('')||'<div class=m>لا سندات بعد</div>')
}
async function voidV(id){
  if(!confirm('إلغاء هذا السند؟ سيُسجَّل قيد عكسي ويبقى السند الأصلي ظاهراً مشطوباً.'))return;
  const r=await call('void_voucher',{p_shop:S.shop.id,p_entry:id});
  if(r!==undefined){toast('تم إلغاء السند ✓');vchLoad()}
}
function vchPrint(k){
  const v=S.vl[k],u=v.currency=='USD'&&v.foreign_amount;
  $('#rcpt').innerHTML=`${coHdr()}<div style="text-align:center;font-weight:700;margin:6px 0">${VT[v.ref_type]||v.ref_type}</div>
  <div>التاريخ: ${v.entry_date}</div>
  ${v.partner_name?`<div>${v.ref_type=='receipt'?'استلمنا من':'دفعنا إلى'}: ${esc(v.partner_name)}</div>`:''}
  ${v.description&&!v.partner_name?`<div>البيان: ${esc(v.description)}</div>`:''}
  ${v.partner_name&&v.description&&v.description.length>10?`<div style="font-size:11px">${esc(v.description)}</div>`:''}<hr>
  <b>المبلغ: ${u?fmt(v.foreign_amount)+' دولار':fmt(v.amount)+' ل.س'}</b>${u?`<br>سعر الصرف: ${fmt(v.rate)} · ما يعادل ${fmt(v.amount)} ل.س`:''}${v.voided?'<br><b>(ملغى)</b>':''}<hr>
  <div style="display:flex;justify-content:space-between;margin-top:20px"><span>المستلم</span><span>المحاسب</span></div>`;
  $('#rcpt').insertAdjacentHTML('beforeend',coFtr());print()
}
async function equity(dir){
  const a=prompt(dir=='deposit'?'مبلغ رأس المال المُضاف':'مبلغ سحب المالك');if(!a||!(+a>0))return;
  const cu=confirm('بالدولار؟ (موافق = دولار، إلغاء = ليرة)')?'USD':'SYP';
  const r=await call('record_equity',{p_shop:S.shop.id,p_client:uid(),p_amount:+a,p_currency:cu,p_rate:rate(cu),p_direction:dir},true);
  if(r!==undefined){toast('تم ✓');vchLoad()}
}

boot();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
