<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الوسام للمحاسبة والمستودعات</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f7b4f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{if(localStorage.theme)document.documentElement.dataset.theme=localStorage.theme}catch(e){}</script>
<style>
:root{--bg:#f3f5f8;--c:#fff;--c2:#f8fafb;--t:#111827;--m:#64748b;--p:#0f7b4f;--pb:#0f7b4f;--ph:#0c6941;--ps:rgba(15,123,79,.1);--b:#e4e8ee;--r:#d33a3a;--rs:rgba(211,58,58,.1);
--sh:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);--sh2:0 12px 32px -8px rgba(16,24,40,.22);--rad:14px;color-scheme:light;
--f:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;--bnh:64px}
:root[data-theme=dark]{--bg:#0e1215;--c:#161b20;--c2:#1b2127;--t:#e6eaee;--m:#94a0ac;--p:#34c27f;--pb:#13875a;--ph:#16996a;--ps:rgba(52,194,127,.13);--b:#262e36;--r:#f06b6b;--rs:rgba(240,107,107,.13);--sh:0 1px 2px rgba(0,0,0,.3);--sh2:0 16px 40px -8px rgba(0,0,0,.6);color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1215;--c:#161b20;--c2:#1b2127;--t:#e6eaee;--m:#94a0ac;--p:#34c27f;--pb:#13875a;--ph:#16996a;--ps:rgba(52,194,127,.13);--b:#262e36;--r:#f06b6b;--rs:rgba(240,107,107,.13);--sh:0 1px 2px rgba(0,0,0,.3);--sh2:0 16px 40px -8px rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.6 var(--f);background:var(--bg);color:var(--t);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
.ic{flex:none;vertical-align:middle}
/* رأس الصفحة */
header.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--c);border-bottom:1px solid var(--b);position:relative;z-index:7}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand img{border-radius:11px;box-shadow:var(--sh)}
.brand b{display:block;font-weight:700;font-size:15.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .m{display:block;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand>div{min-width:0}
.hact{display:flex;gap:6px;align-items:center;flex:none}
.ibtn{display:inline-grid;place-items:center;width:40px;height:40px;border:1px solid var(--b);border-radius:11px;background:var(--c);color:var(--t);cursor:pointer;transition:background .15s,border-color .15s}
.ibtn:hover{background:var(--c2);border-color:var(--m)}
.rate{display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 12px;border:1px solid var(--b);border-radius:11px;background:var(--ps);color:var(--p);font:600 14px var(--f);white-space:nowrap}
button.rate{cursor:pointer}
/* التخطيط */
.lay{display:flex;align-items:flex-start;min-height:calc(100vh - 61px)}
.pg{flex:1;min-width:0}
#stk{position:sticky;top:0;z-index:6;background:var(--bg)}
#cb{gap:8px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--b);font-size:13px;cursor:pointer;background:var(--c);scrollbar-width:none}
#cb::-webkit-scrollbar{display:none}
.chip{background:var(--c2);border:1px solid var(--b);border-radius:999px;padding:3px 12px;white-space:nowrap;font-weight:500}
main{padding:14px 12px;max-width:760px;margin:auto}
footer{padding:6px 12px calc(var(--bnh) + 22px + env(safe-area-inset-bottom))}
/* القائمة الجانبية */
#side{background:var(--c);display:flex;flex-direction:column}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.side-h b{font-size:16px}
.snav{padding:4px 10px 10px;overflow-y:auto;flex:1;min-height:0;overscroll-behavior:contain}
.sg{font-size:12px;font-weight:600;color:var(--m);padding:14px 10px 6px;letter-spacing:.2px}
.snav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;margin:1px 0;border:0;border-radius:10px;background:none;color:var(--t);font:500 14.5px var(--f);cursor:pointer;text-align:start;transition:background .15s,color .15s}
.snav button .ic{color:var(--m)}
.snav button:hover{background:var(--c2)}
.snav button.on{background:var(--ps);color:var(--p);font-weight:700}
.snav button.on .ic{color:var(--p)}
.side-f{padding:10px 14px 16px;border-top:1px solid var(--b);display:grid;gap:8px}
.side-f .b,.side-f .thm{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
#scrim{position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:24;opacity:0;pointer-events:none;transition:opacity .2s}
@media(max-width:959px){
 #side{position:fixed;top:0;bottom:0;right:0;width:min(84vw,320px);z-index:25;transform:translateX(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:var(--sh2);border-radius:18px 0 0 18px;padding-bottom:env(safe-area-inset-bottom)}
 body.drw #side{transform:none}
 header .thb{display:none}
 body.drw #scrim{opacity:1;pointer-events:auto}
}
@media(min-width:960px){
 #side{position:sticky;top:0;width:250px;height:100vh;border-inline-end:1px solid var(--b);flex:none}
 .side-h .ibtn,#bn,.side-f .thm{display:none!important}
 main{max-width:900px;padding:20px}
 .snav button{padding:8px 12px}.sg{padding:10px 10px 4px}
 footer{padding-bottom:22px}
}
/* الشريط السفلي */
#bn{position:fixed;bottom:0;left:0;right:0;z-index:8;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:color-mix(in srgb,var(--c) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
#bn button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--bnh);border:0;background:none;color:var(--m);font:500 11.5px var(--f);cursor:pointer;position:relative}
#bn button .ic{transition:transform .15s}
#bn button.on{color:var(--p);font-weight:700}
#bn button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--p)}
#bn button:active .ic{transform:scale(.88)}
/* عناصر عامة */
.card{background:var(--c);border:1px solid var(--b);border-radius:var(--rad);padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
h2,h3,h4{line-height:1.35}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--b);border-radius:10px;background:var(--c2);color:var(--t);font:inherit;margin:4px 0;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 3px var(--ps);background:var(--c)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--pb)}
button.b,a.b{display:inline-block;padding:10px 16px;border:1px solid transparent;border-radius:10px;background:var(--pb);color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;text-align:center;transition:background .15s,transform .08s,box-shadow .15s;box-shadow:0 1px 2px rgba(16,24,40,.08)}
button.b:hover,a.b:hover{background:var(--ph)}
button.b:active,a.b:active{transform:scale(.97)}
button.b.s{background:var(--c2);color:var(--t);border-color:var(--b);box-shadow:none}
button.b.s:hover{background:var(--b)}
button.b.d{background:var(--r);color:#fff}
button.b.d:hover{filter:brightness(.92)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--p);outline-offset:2px}
button:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--b)}
.m{color:var(--m);font-size:13px}.neg{color:var(--r)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--b);text-align:start;font-size:13px}
th{color:var(--m);font-weight:600}
.strike{text-decoration:line-through}.ok{color:var(--p)}
#cs{background:#fff4d6;color:#6b4e00;padding:9px 14px;font-size:13px;line-height:1.7;border-bottom:1px solid #f3dd9b}
:root[data-theme=dark] #cs{background:#3b300c;color:#ffe69c;border-color:#5a4a16}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) #cs{background:#3b300c;color:#ffe69c;border-color:#5a4a16}}
#done{position:fixed;inset:0;background:rgba(10,14,18,.55);backdrop-filter:blur(3px);z-index:30;display:flex;align-items:center;justify-content:center;padding:18px}
#done .dn{background:var(--c);color:var(--t);border-radius:20px;padding:22px;max-width:420px;width:100%;text-align:center;box-shadow:var(--sh2)}
a{color:var(--p)}a.b{color:#fff}
details{border-bottom:1px solid var(--b);padding:10px 0}summary{font-weight:600;cursor:pointer}
details ol,details ul{margin:8px 0;padding-inline-start:22px;line-height:1.9}
#scan{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
#reader{width:100%;max-width:480px}#scan .m{color:#fff;text-align:center}
#rcpt{display:none}
@media print{body>*:not(#rcpt){display:none!important}#rcpt{display:block;width:72mm;font:12px system-ui,Tahoma,sans-serif;color:#000}#rcpt.wide{width:100%!important}}
#toast{position:fixed;bottom:calc(var(--bnh) + 14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);background:#1f2937;color:#fff;padding:11px 16px;border-radius:12px;display:none;z-index:60;box-shadow:var(--sh2);font-weight:500;animation:tin .22s ease-out}
@media(min-width:960px){#toast{bottom:22px}}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
/* النوافذ المنبثقة */
.dlg-bg{position:fixed;inset:0;z-index:50;background:rgba(10,14,18,0);display:flex;align-items:flex-end;justify-content:center;transition:background .18s}
.dlg-bg.in{background:rgba(10,14,18,.5)}
.dlg{background:var(--c);color:var(--t);width:100%;max-width:440px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--sh2);transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);max-height:90vh;overflow-y:auto}
.dlg-bg.in .dlg{transform:none}
.dlg::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--b);margin:-6px auto 12px}
@media(min-width:600px){.dlg-bg{align-items:center;padding:18px}.dlg{border-radius:20px;padding:20px;transform:translateY(12px) scale(.97);opacity:0;transition:transform .18s,opacity .18s}.dlg-bg.in .dlg{opacity:1}.dlg::before{display:none}}
.dlg-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dlg-h b{font-size:16.5px;line-height:1.4}
.dlg-ic{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--ps);color:var(--p);flex:none}
.dlg-ic.neg{background:var(--rs);color:var(--r)}
.dlg-m{white-space:pre-line;color:var(--m);font-size:14px;line-height:1.75;margin:4px 0 8px}
.dlg label{display:block;font-size:13px;font-weight:600;color:var(--m);margin-top:10px}
.dlg-err{color:var(--r);font-size:13px;min-height:0}
.dlg-err:not(:empty){margin-top:6px}
.dlg-f{display:flex;gap:8px;margin-top:16px}
.dlg-f .b{flex:1;padding:12px}
.dlg-f.col{flex-direction:column}

/* لوحة التحكم */
body.home #cb{display:none!important}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:2px 2px 14px}
.hero h2{margin:2px 0 0;font-size:22px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--ps);color:var(--p);white-space:nowrap}
.pill.bad{background:var(--rs);color:var(--r)}
.pill.warn{background:#fff4d6;color:#6b4e00}
.note{display:flex;gap:10px;align-items:center;border-color:#f3dd9b;background:#fffbeb;color:#6b4e00}
.note.bad{border-color:var(--r);background:var(--rs);color:var(--r)}
:root[data-theme=dark] .note:not(.bad),:root[data-theme=dark] .pill.warn{background:#3b300c;color:#ffe69c;border-color:#5a4a16}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .note:not(.bad),:root:not([data-theme=light]) .pill.warn{background:#3b300c;color:#ffe69c;border-color:#5a4a16}}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;border:1px solid var(--b);border-radius:var(--rad);background:var(--c);color:var(--t);font:600 12.5px var(--f);cursor:pointer;box-shadow:var(--sh);transition:transform .08s,border-color .15s}
.qa button span{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--ps);color:var(--p)}
.qa button:hover{border-color:var(--p)}.qa button:active{transform:scale(.96)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--c);border:1px solid var(--b);border-radius:var(--rad);padding:13px 14px;box-shadow:var(--sh);min-width:0}
.kpi .kl{display:flex;align-items:center;gap:6px;color:var(--m);font-size:12.5px;font-weight:600}
.kpi .kl .ic{color:var(--p)}
.kpi .kv{font-size:21px;font-weight:700;margin:6px 0 2px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .kv small{font-size:12px;color:var(--m);font-weight:500}
.kpi .ks{font-size:12px;color:var(--m);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dl{display:inline-flex;align-items:center;gap:2px;font-weight:700;direction:ltr}.dl.up{color:var(--p)}.dl.dn{color:var(--r)}
.ch-h,.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.sec-h b{display:flex;align-items:center;gap:7px;font-size:15px}.sec-h b .ic{color:var(--p)}
.lnk{border:0;background:none;color:var(--p);font:600 13px var(--f);cursor:pointer;display:inline-flex;align-items:center;gap:2px;padding:4px}
.chart{width:100%;height:auto;display:block;margin-top:4px}
.chart text{font-family:var(--f);fill:var(--m)}
.chart .bar{fill:var(--ps);transition:fill .15s}.chart .bar.t{fill:var(--pb)}.chart g:hover .bar{fill:var(--p)}
.chart .vl{fill:var(--t);font-weight:600}
.hgrid{display:grid;gap:12px}.hgrid>.card{margin:0}
.it.cl{cursor:pointer;border-radius:8px;transition:background .12s}.it.cl:hover{background:var(--c2)}
.it:last-child{border-bottom:0}
.cashg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:4px}
.cashg div{background:var(--c2);border:1px solid var(--b);border-radius:12px;padding:10px 12px}
.cashg b{display:block;font-size:17px;direction:ltr;text-align:right}
.bal2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 8px}
.bal2 div{border-radius:12px;padding:10px 12px;background:var(--c2);border:1px solid var(--b)}
.bal2 b{display:block;font-size:17px;direction:ltr;text-align:right}
.sk{display:block;border-radius:8px;background:linear-gradient(90deg,var(--c2) 25%,var(--b) 50%,var(--c2) 75%);background-size:200% 100%;animation:sk 1.2s infinite linear;height:14px;margin:8px 0}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.empty{color:var(--m);font-size:13px;text-align:center;padding:14px 0}
@media(min-width:960px){.kpis{grid-template-columns:repeat(4,1fr)}.hgrid{grid-template-columns:1fr 1fr}.qa{grid-template-columns:repeat(4,minmax(0,150px))}}
@media(max-width:360px){.kpi .kv{font-size:18px}.qa button{font-size:11.5px}}

/* شاشة البيع */
.posv{display:grid;gap:12px}
.sbx{padding:10px;margin-bottom:10px}
.sbar{display:flex;align-items:center;gap:8px;position:relative}
.sbar>.ic{position:absolute;right:12px;color:var(--m);pointer-events:none}
.sbar input{margin:0;padding-right:40px;height:46px;font-size:16px}
.sbar .ibtn{width:46px;height:46px;flex:none}
.qh{display:flex;justify-content:space-between;gap:8px;margin-top:6px;min-height:18px}
.kbd{display:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:start;padding:10px;min-height:118px;border:1.5px solid var(--b);border-radius:var(--rad);background:var(--c);color:var(--t);font:inherit;cursor:pointer;box-shadow:var(--sh);transition:border-color .15s,transform .08s,background .15s;-webkit-user-select:none;user-select:none}
.tile:hover{border-color:var(--m)}.tile:active{transform:scale(.96)}
.tile.in{border-color:var(--p);background:var(--ps)}
.tile.pop{animation:pop .28s ease-out}
@keyframes pop{40%{transform:scale(1.05)}100%{transform:none}}
.av{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;font-weight:700;font-size:16px;background:hsl(var(--h) 60% 92%);color:hsl(var(--h) 45% 30%);margin-bottom:2px}
:root[data-theme=dark] .av{background:hsl(var(--h) 30% 22%);color:hsl(var(--h) 60% 80%)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .av{background:hsl(var(--h) 30% 22%);color:hsl(var(--h) 60% 80%)}}
.qb{position:absolute;top:8px;left:8px;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--pb);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;direction:ltr}
.tn{font-weight:600;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%}
.tp{font-weight:700;font-size:13.5px;margin-top:auto;direction:ltr;align-self:flex-end}.tp small{color:var(--m);font-weight:500;font-size:11px}
.ts{font-size:11.5px;color:var(--m)}
.more{width:100%;margin-top:8px}
.cartc{padding:12px 14px}
.cl{display:grid;grid-template-columns:1fr auto;grid-template-areas:"n n" "s t";gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--b)}
.cl.over .cl-n b{color:var(--r)}
.cl-n{grid-area:n;min-width:0}.cl-n b{display:block;font-size:14.5px;line-height:1.35}
.cl-p{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px}
.cpr{width:96px;padding:3px 8px;margin:2px 0;font-size:13px;border-radius:8px;background:transparent;border-style:dashed}
.cnt{width:100%;padding:3px 8px;margin:2px 0;font-size:12px;border-radius:8px;background:transparent;border-style:dashed}
.cun{width:auto;max-width:112px;padding:3px 6px;margin:2px 0;font-size:13px;border-radius:8px}
.dscr{margin-top:10px;padding:10px;border-radius:12px;background:var(--c2);border:1px dashed var(--b)}.dscr input,.dscr select{margin:0}.dscr select{flex:0 0 auto;width:auto}
.step{grid-area:s;display:inline-flex;align-items:center;border:1px solid var(--b);border-radius:12px;overflow:hidden;background:var(--c2);width:max-content}
.step button{width:42px;height:40px;border:0;background:none;color:var(--t);cursor:pointer;display:grid;place-items:center}
.step button:hover{background:var(--b)}.step button.rm{color:var(--r)}
.step input{width:56px;margin:0;border:0;border-radius:0;text-align:center;font-weight:700;font-size:15px;background:var(--c);padding:8px 2px;border-inline:1px solid var(--b)}
.step input:focus{box-shadow:none}
.cl-t{grid-area:t;font-size:16px;text-align:left}
.cartc .empty{padding:22px 0}.cartc .empty .ic{color:var(--m);opacity:.6;margin-bottom:6px}

let FL=false;
async function flush(){
  if(FL||!navigator.onLine)return;
  const Q=qGet();if(!Q.length)return;
  FL=true;let ok=0;const keep=[];
  try{
    for(const x of Q){
      const {error}=await db.rpc(x.fn,x.args).then(r=>r,e=>({error:e}));
      if(!error)ok++;
      else if(bad(error))keep.push(x);
      else{const f=JSON.parse(localStorage.f||'[]');f.push({...x,err:error.message});localStorage.f=JSON.stringify(f);toast('رفض الخادم عملية مؤجلة: '+error.message)}
    }
  }finally{FL=false}
  qSet(keep);
  if(ok){toast('تم ترحيل '+ok+' عملية إلى النظام ✓');if(S.shop){await refresh();if(S.tab=='hist')histV()}}
}

async function refresh(){
  const [a,b,c]=await Promise.all([

    db.from('partners').select('*').order('name'),

  S.prods=a.data||[];S.parts=b.data||[];if(c.data)S.shop=c.data;
  await loadUO();
  const cr=await db.from('shop_currencies').select('*').eq('shop_id',S.shop.id).eq('is_active',true).order('code').then(r=>r,()=>({data:null,error:true}));
  S.currencies=cr.data||[{code:'SYP',name:'ليرة سورية',rate_to_syp:1,is_active:true},{code:'USD',name:'دولار أمريكي',rate_to_syp:+S.shop.usd_rate||1,is_active:true}];

  const cm={};
  if(can('costs')){const r=await db.rpc('product_costs',{p_shop:S.shop.id});(r.data||[]).forEach(x=>cm[x.id]=+x.avg_cost)}

  const [w,l]=await Promise.all([
    db.from('warehouses').select('id,name,is_default').order('created_at'),
    db.from('stock_levels').select('product_id,warehouse_id,qty')]);
  if(w.error||l.error)return;

}

const loadPdfLibs=()=>PL||(PL=Promise.all([loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'),loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js')]).catch(e=>{PL=null;throw e}));

function pdfPageHtml(p,i,n){

  <div style="text-align:center;font-size:18px;font-weight:700;margin-bottom:3px">${p.title}</div>${p.sub?`<div style="text-align:center;font-size:12px;color:#444;margin-bottom:10px">${p.sub}</div>`:''}
  ${p.body}

async function pdfBuild(pages){
  await loadPdfLibs();
  const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'mm',format:'a4',compress:true});
  for(let i=0;i<pages.length;i++){
    const box=document.createElement('div');box.style.cssText='position:fixed;left:-12000px;top:0';
    box.innerHTML=pdfPageHtml(pages[i],i+1,pages.length);document.body.appendChild(box);
    const cv=await html2canvas(box.firstChild,{scale:2,backgroundColor:'#ffffff'});box.remove();
    if(i)pdf.addPage();
    pdf.addImage(cv.toDataURL('image/jpeg',0.9),'JPEG',0,0,210,297)
  }
  return pdf.output('blob')
}
function invPages(x){
  const cu=x.currency=='USD'?'$':'ل.س',N=x.items.some(i=>String(i.n).length>38||i.note)?10:14,ch=[];

    +(last?`<div style="margin-top:14px;font-size:14px;width:58%;margin-inline-start:auto">${+x.discount>0?`<div style="display:flex;justify-content:space-between"><span>المجموع قبل الحسم</span><span>${fmt(+x.total+ +x.discount)} ${cu}</span></div><div style="display:flex;justify-content:space-between"><span>${x.kind=='sale'?'الحسم الممنوح':'الحسم المكتسب'}</span><span>-${fmt(x.discount)} ${cu}</span></div>`:''}<div style="display:flex;justify-content:space-between"><span>${+x.discount>0?'الصافي':'الإجمالي'}</span><b>${fmt(x.total)} ${cu}</b></div><div style="display:flex;justify-content:space-between"><span>المدفوع</span><span>${fmt(x.paid)} ${cu}</span></div><div style="display:flex;justify-content:space-between;border-top:1px solid #999;margin-top:4px;padding-top:4px"><span>المتبقي</span><b>${fmt(x.total-x.paid)} ${cu}</b></div></div>${x.voided_at?'<div style="text-align:center;color:#c0392b;font-size:28px;font-weight:700;margin-top:22px">ملغاة</div>':''}`:'');
    return {title:PDFLBL[x.kind]+(x.voided_at?' (ملغاة)':''),sub:'',body,last}})

function stmtPages(o,f,t,rows,det){
  const A=S.sacc||stmtAcc(o),bal=A.bal,dr=A.dr,cr=A.cr,LIM=det?24:20,pages=[];
  let cur=[],bud=0;
  rows.forEach(x=>{const cost=det?1+((x.items&&x.items.length)?x.items.length+1:0):1;
    if(cur.length&&bud+cost>LIM){pages.push(cur);cur=[];bud=0}cur.push(x);bud+=cost});
  if(cur.length||!pages.length)pages.push(cur);
  const last=rows.length?rows[rows.length-1]:null,cu=c=>c=='USD'?'$':'ل.س';
  return pages.map((c,pi)=>{const isLast=pi==pages.length-1;
    const body=`<table style="width:100%;border-collapse:collapse"><tr><th ${TH}>التاريخ<th ${TH}>البيان<th ${TH}>مدين<th ${TH}>دائن<th ${TH}>الرصيد</tr>${c.map(x=>{const it=det&&x.items&&x.items.length;
      return `<tr><td ${TD}>${x.entry_date}<td ${TD}>${esc(x.description||'')}<td ${TD}>${+dr(x)?fmt(dr(x)):''}<td ${TD}>${+cr(x)?fmt(cr(x)):''}<td ${TD}><b>${fmt(bal(x))}</b></tr>`+(it?`<tr><td colspan=5 style="padding:3px 18px 8px;border-bottom:1px solid #ddd;font-size:11px;color:#333">${x.items.map(i=>esc(i.n)+' — '+fmt(i.q)+' × '+fmt(i.p)+' = '+fmt(i.t)).join('<br>')}<br><b>إجمالي الفاتورة ${fmt(x.doc_total)} ${cu(x.doc_cur)} · المدفوع ${fmt(x.doc_paid)} ${cu(x.doc_cur)}</b></td></tr>`:'')}).join('')}</table>`
      +(isLast?`<div style="margin-top:14px;text-align:end;font-size:16px"><b>الرصيد النهائي: ${last?fmt(bal(last)):0} ${A.unit}</b></div>`:'');
    return {title:esc(o.title)+(det?' (تفصيلي)':''),sub:f+' ← '+t+esc(A.lbl),body,last:isLast}})
}

function stmtAcc(o){

  if(mode==='conv'){const r=rate('USD')||1;return {mode,sym:'$',unit:'$',r,lbl:' (بالدولار، محوّل بسعر الصرف الحالي '+fmt(r)+')',dr:x=>x.debit/r,cr:x=>x.credit/r,bal:x=>sgn*x.balance/r}}
  return {mode,sym:'',unit:'ل.س',lbl:o.pcur==='USD'&&o.partner?' (بالليرة، بقيمة كل عملية وقت تسجيلها)':'',dr:x=>+x.debit,cr:x=>+x.credit,bal:x=>sgn*x.balance}
}

<li>أو من صفحة تعديل المادة، قسم «العروض التجارية».</li>
<li>حدّد: <b>يسري العرض</b> (البيع، الشراء، أو كليهما)، وكمية الشراء أو البيع مع وحدتها (مثلاً 1 طرد)، والكمية المجانية مع وحدتها (مثلاً 1 قطعة).</li></ol>
<p><b>قسم العروض التجارية:</b> يعرض كل عروض الأصناف مجمّعة حسب المادة، مع البحث بالاسم، وخيار «العروض الفعّالة فقط». لمن يملك صلاحية المنتجات: إضافة وإيقاف وتفعيل وحذف، والضغط على اسم المادة يفتح صفحتها.</p>
<p><b>في الفاتورة:</b></p>
<ul>
<li>عند وصول الكمية لشرط العرض يظهر تحت البند سطر <b>🎁 +X مجاناً</b> وتُضاف الكمية المجانية تلقائياً بسعر صفر.</li>
<li>العرض يُطبَّق لكل مضاعف كامل: مع كل 1 طرد قطعة، فإذا بعت 3 طرود تأخذ 3 قطع مجاناً.</li>
<li>للمادة أكثر من عرض؟ يُطبَّق العرض الأفضل للزبون فقط، ولا تتراكم العروض.</li>
<li><b>لعدم اعتماد العرض في هذه الفاتورة</b> اضغط <b>عدم اعتماد العرض</b> تحت البند. وللرجوع اضغط <b>اعتماد العرض</b>. هذا القرار للفاتورة الحالية فقط ولا يغيّر العرض نفسه.</li>
<li>الكمية المجانية تُخصم من المخزون، فإن لم يكفِ المخزون ترفض الفاتورة: قلّل الكمية أو لا تعتمد العرض.</li>
<li>عند <b>تعديل</b> فاتورة قديمة لا يُعاد تطبيق العروض، وتظهر الكمية المجانية القديمة كبند مستقل بسعر صفر يمكنك تعديله أو حذفه.</li></ul>
<p><b>الأثر المحاسبي:</b> في البيع تُحسب تكلفة الكمية المجانية ضمن تكلفة البضاعة المباعة. وفي الشراء (بضاعة مجانية من المورد) تنخفض متوسط تكلفة المادة تلقائياً.</p>`},
{t:'🛒 البيع',o:0,h:`<ol>
<li>ابحث بالاسم أو الباركود، أو اضغط 📷 لمسح المنتجات تباعاً (اضغط إغلاق عند الانتهاء).</li>
<li>اضغط على المنتج ليُضاف للفاتورة، وعدّل الكمية أو السعر من الفاتورة نفسها. إن كانت للمادة <b>وحدات</b> اختر الوحدة (طرد، قطعة...) من القائمة بجانب السعر.</li>
<li>اختر العملة: ليرة أو دولار.</li>
<li>اختر الزبون (اختياري للبيع النقدي). لإضافة زبون جديد اضغط ＋. تُحدَّد الأسعار حسب <b>تسعيرة الزبون</b> (مفرق، نصف جملة، جملة)، وتتبع الفاتورة عملة حساب الزبون.</li>
<li>راقب <b>العروض</b>: إن ظهر 🎁 تحت بند فهي كمية مجانية، ويمكنك عدم اعتمادها بزر «عدم اعتماد العرض».</li>
<li>لإضافة <b>ملاحظة على بند</b> (مثل: لون، مقاس، تعليمة تسليم) اضغط <b>+ ملاحظة</b> تحت البند واكتبها. تظهر في تفاصيل الفاتورة والطباعة وPDF.</li>
<li>إن أردت <b>حسماً</b> اكتبه في حقل «الحسم الممنوح للزبون» (مبلغ أو %). تعرف التفاصيل في قسم «الحسم».</li>
<li>اختر <b>الدفع</b>: نقداً بالكامل، أو <b>آجل (بدون دفعة)</b>، أو دفعة جزئية والباقي آجل. البيع الآجل يحتاج اختيار الزبون. المبلغ المحسوب هو <b>الصافي بعد الحسم</b>.</li>
<li>اضغط <b>تسجيل البيع</b>. فعّل «طباعة الوصل بعد البيع» إذا تريد الطباعة تلقائياً.</li></ol>`},
{t:'🏷️ الحسم في فواتير البيع والشراء',o:0,h:`<p class=m>يظهر حقل الحسم أسفل بنود الفاتورة بعد إضافة أول بند.</p>
<ul>
<li>اكتب الحسم كـ<b>مبلغ</b> أو كـ<b>نسبة %</b> باختيارك من القائمة بجانب الحقل. يظهر أسفله: المجموع − الحسم = الصافي.</li>
<li>يجب أن يكون الحسم <b>أقل من إجمالي الفاتورة</b>.</li>
<li><b>في فاتورة البيع</b> يُرحَّل الحسم إلى حساب <b>الحسم الممنوح</b> (يُعدّ من المصاريف). <b>في فاتورة الشراء</b> يُرحَّل إلى حساب <b>الحسم المكتسب</b> (يُعدّ من الإيرادات). يُنشأ الحسابان تلقائياً أول مرة تستخدم فيها الحسم.</li>
<li><b>مثال بيع:</b> إجمالي 100,000 وحسم 10% = 10,000، فالصافي 90,000. إن دفع الزبون 50,000 يبقى عليه 40,000 آجلاً. تُسجَّل المبيعات 100,000 والحسم الممنوح 10,000.</li>
<li><b>مثال شراء:</b> إجمالي 500,000 وحسم 20,000، فالمستحق للمورد 480,000. يدخل المخزون بقيمته قبل الحسم، ويُسجَّل الحسم المكتسب 20,000 إيراداً.</li>
<li>رصيد الزبون أو المورد وكشف حسابه يُحسبان على <b>الصافي</b>.</li>
<li>يظهر الحسم في تفاصيل الفاتورة والطباعة وملف PDF: المجموع قبل الحسم، ثم الحسم، ثم الصافي.</li>
<li><b>تعديل أو إلغاء</b> الفاتورة يعكس الحسم تلقائياً مع باقي القيد.</li>
<li>في التقارير: الحسم الممنوح ضمن المصاريف، والحسم المكتسب يظهر كسطر «إيرادات أخرى» ويدخل في صافي الربح.</li>
<li><b>تنبيه:</b> عند عمل مرتجع لفاتورة عليها حسم تُحسب قيمة المرتجع بسعر البند قبل الحسم. راجع المبلغ والتسوية النقدية قبل الحفظ.</li></ul>`},
{t:'📥 الشراء',o:1,h:`<ul>
<li>نفس خطوات البيع، لكن تُدخل <b>سعر التكلفة</b> لكل وحدة، وتختار <b>المورد</b> إذا كان الشراء آجلاً.</li>
<li>يمكنك الشراء بوحدة أكبر (مثل الطرد) فيتحوّل التكلفة تلقائياً إلى تكلفة الوحدة الأساسية في المخزون.</li>
<li>إن سجّلت للمورد <b>أسعاراً خاصة</b> (من صفحته ← أسعار المورد) تظهر تكلفة المواد عنده تلقائياً عند اختياره.</li>
<li><b>الحسم المكتسب:</b> اكتب ما حسمه لك المورد في حقل الحسم، فيُرحَّل إلى حساب الحسم المكتسب ويقلّل المبلغ المستحق للمورد.</li>
<li><b>العروض:</b> إن كان للمادة عرض شراء (مثلاً بضاعة مجانية مع كل طرد) تُضاف الكمية المجانية لمخزونك بتكلفة صفر، فيخفض ذلك متوسط تكلفة المادة. يمكنك عدم اعتماده من زر «عدم اعتماد العرض».</li>
<li>سعر التكلفة هو الذي يحدد ربحك، فتأكد منه. التكلفة تُحسب بمتوسط مرجح عند تكرار الشراء.</li></ul>`},
{t:'💳 الديون وكشف الحساب',o:1,h:`<ul>
<li>تبويب <b>الديون</b> يعرض الزبائن (كم عليهم) والموردين (كم علينا) والأطراف التي هي زبون ومورد معاً (رصيدان).</li>
<li>عند إضافة طرف حدّد <b>نوعه</b>، و<b>تسعيرة الزبون</b> (مفرق، نصف جملة، جملة)، و<b>عملة حسابه</b> (ليرة أو دولار).</li>
<li>في كشف حساب الزبون أو المورد اختر <b>مختصر</b> (الحركات فقط) أو <b>تفصيلي (بالمواد)</b> لترى تحت كل فاتورة موادها وكمياتها وأسعارها وإجماليها والمدفوع منها، ويمكنك طباعة أي منهما.</li>
<li><b>عملة الكشف:</b> يفتح كشف الزبون أو المورد بعملة حسابه المسجّلة. وبالزرين <b>بالليرة / بالدولار</b> أعلى الكشف تغيّر العرض. حساب الدولار يُعرض بالليرة بقيمة كل عملية وقت تسجيلها، وحساب الليرة يُعرض بالدولار محوّلاً بسعر الصرف الحالي (يُكتب السعر أعلى الكشف). الطباعة وPDF تتبعان العملة المعروضة.</li>
<li>اضغط على الاسم: ترى كشف الحساب (بفترة من/إلى وطباعة)، وتسجّل <b>سند قبض</b> من الزبون أو <b>سند دفع</b> للمورد، أو <b>رصيد افتتاحي</b> لدين قديم.</li></ul>`},
{t:'🧾 الفواتير',o:0,h:`<ul>
<li>تبويب <b>الفواتير</b> يعرض آخر الفواتير. اضغط على فاتورة لترى تفاصيلها (وتفاصيل الحسم إن وُجد) ولطباعتها مجدداً.</li>
<li>البنود المجانية من العروض تظهر بسعر صفر وعليها علامة «مجاني». وتظهر لكل بند وحدته (طرد، قطعة...) وملاحظته إن وُجدت، في العرض والطباعة وPDF.</li>
<li><b>المالك فقط:</b> زر <b>تعديل</b> يفتح الفاتورة للتعديل (تُلغى القديمة وتُسجَّل الجديدة تلقائياً مع حسمها)، وزر <b>إلغاء</b> يعكس الفاتورة ويعيد المخزون.</li>
<li>زر <b>📄 إرسال PDF عبر واتساب</b> بصفحة الفاتورة: يجهّز ملف PDF بترويسة شركتك، ثم اختر <b>إرسال عبر واتساب</b> وحدّد جهة الاتصال، أو <b>فتح محادثة</b> الزبون برسالة جاهزة وأرفق الملف. وكذلك بكشف الحساب (المختصر والتفصيلي).</li>
<li>الفاتورة الملغاة تبقى ظاهرة مشطوبة حفاظاً على السجل. تعديل أو إلغاء فاتورة شراء يُرفض إذا بِعتَ جزءاً من بضاعتها.</li></ul>`},
{t:'↩️ المرتجعات (للمالك)',o:1,h:`<ul>
<li>من تفاصيل الفاتورة اضغط <b>مرتجع مبيع</b> أو <b>مرتجع شراء</b>. المرتجع مستند مستقل لا يلغي الفاتورة.</li>
<li>أدخل الكمية المرتجعة لكل بند. تعود البضاعة إلى المستودع الأصلي، ولا يُسمح بتجاوز الكمية الأصلية أو ما أُرجع سابقاً.</li>
<li>اكتب المبلغ النقدي المعاد للزبون (أو المستلم من المورد). والباقي يُسوّى على حساب الطرف. وإن كانت الفاتورة بلا طرف فيجب أن يساوي المبلغ كامل قيمة المرتجع.</li>
<li>قائمة كل المرتجعات من تبويب الفواتير ← <b>مرتجعات البيع والشراء</b>.</li>
<li>المرتجعات تحتاج إنترنت، ولا يتوفر تعديل أو إلغاء المرتجع بعد حفظه، فراجع الكميات والمبلغ قبل التأكيد.</li>
<li>إن انقطع الاتصال أثناء الحفظ ولم تُعرف النتيجة، افتح قائمة المرتجعات وأعد إرسال الطلب نفسه ولا تنشئ بديلاً عنه.</li></ul>`},
{t:'🏬 المخزون والمستودعات',o:1,h:`<ul>
<li>من تبويب <b>المخزون</b>: اختر المستودع الحالي، أضف مستودعاً جديداً، أو حوّل بضاعة بين مستودعين.</li>
<li><b>الجرد السريع لمادة واحدة:</b> اضغط على المنتج وأدخل الكمية الفعلية الموجودة (بالوحدة الأساسية)، فيسوّي البرنامج الفرق ويسجّله كخسارة أو ربح جرد. وللجرد الكامل للمستودع استخدم <b>الجرد السنوي</b> (القسم التالي).</li>
<li><b>مخزون افتتاحي:</b> لتسجيل بضاعة موجودة مسبقاً بدون التأثير على الصندوق. استخدمه مرة واحدة لكل منتج.</li>
<li>الفواتير تُسجَّل على المستودع المختار. إذا بِعتَ من مستودع رصيده أقل يظهر رصيده بالسالب تنبيهاً: صحّحه بالتحويل أو اختر المستودع الصحيح.</li></ul>`},
{t:'📋 الجرد السنوي للمخازن',o:1,h:`<p class=m>جلسة جرد كاملة لمستودع واحد، مع مراجعة الفروقات وتسويتها وطباعة المحضر. تجدها في <b>المزيد ← الجرد السنوي</b> أو من زر الجرد في تبويب المخزون.</p>
<ol>
<li><b>البدء:</b> اختر المستودع واضغط <b>بدء جرد</b> واكتب اسماً (مثل: جرد سنوي 2026). يثبّت البرنامج أرصدة النظام الحالية كنقطة بداية.</li>
<li><b>ورقة العدّ:</b> اطبعها أو احفظها PDF لتعدّ عليها بالمستودع. اترك خيار <b>الجرد الأعمى</b> مفعّلاً لتُخفى كميات النظام عن العادّين فيعدّون بحياد.</li>
<li><b>إدخال الكميات:</b> اكتب الكمية الفعلية لكل مادة، أو اضغط <b>مطابق</b> إن طابقت النظام، أو امسح الباركود 📷 (كل مسحة تضيف 1). للمواد ذات الوحدات اختر وحدة العدّ (طرد، كرتونة...). يظهر شريط تقدّم، وفلتر لإظهار «لم يُجرد» أو «فيه فرق»، وبحث بالاسم أو الباركود.</li>
<li><b>المراجعة:</b> اضغط <b>مراجعة وتسوية</b> لترى عدد المواد المجرودة وغير المجرودة والفروقات، وقيمة الزيادة والعجز وصافي الفرق (لمن يملك صلاحية رؤية التكلفة). تستطيع طباعة تقرير ما قبل التسوية.</li>
<li><b>المواد غير المجرودة:</b> تُترك كمياتها كما هي افتراضياً. وإن فعّلت خيار «اعتبارها صفراً» تُسجَّل عجزاً كاملاً.</li>
<li><b>التطبيق:</b> اضغط <b>تطبيق التسوية</b> (يحتاج إنترنت). تُعدَّل الكميات وتُسجَّل قيود العجز والزيادة تلقائياً. ما بيع أو اشتُري بعد بدء الجرد يُراعى تلقائياً. وإن انقطع الاتصال في المنتصف أعد الضغط فيكمل الباقي دون تكرار ما طُبّق.</li>
<li><b>المحضر:</b> بعد التسوية يظهر محضر الجرد للطباعة أو PDF، وفيه توقيعات أمين المستودع والمحاسب والمدير، ويُحفظ في «محاضر الجرد السابقة» (آخر 10 محاضر).</li></ol>
<ul>
<li>جلسة الجرد تخص مستودعاً واحداً. كرّر الخطوات لباقي المستودعات.</li>
<li><b>مهم:</b> مسودة الجرد والمحاضر المحفوظة تبقى على الجهاز نفسه فقط ولا تدخل النسخ الاحتياطي. أكمل الجرد على جهاز واحد، واطبع المحضر أو نزّله PDF بعد التسوية.</li>
<li>لا يوجد تراجع تلقائي بعد التطبيق، فإن أخطأت أجرِ تسوية جديدة للمادة. وإلغاء الجلسة قبل التطبيق لا يؤثر على المخزون.</li>
<li>لدقة أكبر قلّل حركة البيع والشراء أثناء العدّ.</li></ul>`},
{t:'📊 التقارير',o:1,h:`<ul>
<li>الملخص: الصندوق، ذمم الزبائن، قيمة المخزون، ذمم الموردين، المبيعات، وصافي الربح.</li>
<li><b>تقرير الفترة:</b> اليوم، 7 أيام، 30 يوماً، أو من تاريخ إلى تاريخ. المبيعات تُعرض بالإجمالي قبل الحسم، والحسم الممنوح ضمن المصاريف، والحسم المكتسب كسطر «إيرادات أخرى».</li>
<li>المصاريف والسندات وتصريف الدولار من تبويب <b>السندات</b>، والنسخ الاحتياطي من تبويبه المستقل.</li></ul>`},
{t:'🏭 التصنيع',o:1,h:`<ol>
<li>عرّف المواد الخام والمنتج الجاهز في تبويب المنتجات، وسجّل مخزون المواد الخام.</li>
<li>من تبويب <b>التصنيع</b> اكتب <b>الوصفة</b>: المواد اللازمة لوحدة واحدة من المنتج الجاهز.</li>
<li>لتنفيذ التصنيع: اختر المنتج والكمية، وأضف مصاريف إضافية (أجور، كهرباء) إن وجدت، ثم <b>تنفيذ</b>. تُخصم المواد ويُضاف المنتج بتكلفته الحقيقية.</li>
<li>يمكن إلغاء أمر التصنيع إذا لم يُبَع أو يُستهلك جزء من المنتج الجاهز.</li></ol>`},
{t:'📒 الحسابات (للمحاسبين)',o:1,h:`<ul>
<li>تبويب <b>الحسابات</b> يعرض شجرة الحسابات. اضغط على أي حساب (أو صندوق) لترى كشف حسابه بفترة من/إلى مع الطباعة.</li>
<li>يمكنك إضافة حساب تحت مجموعة، وإنشاء صناديق إضافية والتحويل بينها، وتسجيل سند أو قيد بين حسابين، واستيراد دليل حسابات جاهز.</li>
<li>حسابا <b>الحسم الممنوح</b> (مصاريف) و<b>الحسم المكتسب</b> (إيرادات) يُنشآن تلقائياً عند أول فاتورة بحسم، وتجد فيهما كل الحسومات مع تاريخها.</li>
<li>لا تعدّل الشجرة إلا إذا كنت تعرف المحاسبة. حسابات البرنامج الأساسية (الصندوق، الزبائن، المخزون، المبيعات...) تستطيع تغيير اسمها ورقمها بأمان.</li></ul>`},
{t:'💰 القبض من الزبائن والدفع للموردين',o:1,h:`<ul>
<li>تبويب <b>القبض والدفع</b>: اختر <b>قبض من زبون</b> أو <b>دفع لمورد</b>، ثم الطرف. يظهر لك دينه بالليرة وبالدولار.</li>
<li>اكتب المبلغ واختر <b>عملة الدفع</b>، ثم اختر <b>عملة الدين</b> التي تريد تسديدها. يمكنك أن تقبض بعملة مختلفة عن عملة دين الزبون، أو تدفع بعملة مختلفة عن عملة دين المورد.</li>
<li>عند اختلاف العملة اكتب <b>سعر الصرف المتفق عليه</b>، وسيعرض البرنامج كم سيُسدَّد من الدين قبل الحفظ. مثال: زبون عليه 100 دولار دفع 1,200,000 ليرة بسعر 12,000 فيُسدَّد 100 دولار.</li>
<li>إذا تغيّر السعر عمّا سُجّل به الدين، يُسجَّل الفرق تلقائياً في حساب <b>فروقات صرف</b> (ربح أو خسارة)، ويُغلق الدين بدقة بدون باقٍ عالق.</li>
<li>في القائمة تحتها: 🖨 لطباعة السند، و<b>إلغاء</b> لعكسه ويعود رصيد الطرف كما كان.</li></ul>`},
{t:'🧾 السندات الأخرى (مصروف وتصريف)',o:1,h:`<ul>
<li>تبويب <b>السندات</b> للمصروفات وتصريف الدولار (شراء أو بيع الدولار بالليرة، يحرّك صندوق الليرة وصندوق الدولار معاً)، مع قائمة آخر السندات للطباعة أو الإلغاء.</li>
<li><b>الزبون والمورد معاً:</b> عند إضافة الطرف اختر «زبون ومورد معاً» (أو غيّر نوعه من صفحته بزر تعديل). يظهر في البيع والشراء، ويقبل منه ويدفع له، وله رصيدان: لنا عليه وله علينا. ولتسوية الرصيدين ببعضهما اضغط <b>مقاصة</b> من صفحته.</li></ul>`},
{t:'💵 صندوق الدولار والعملات',o:1,h:`<ul>
<li>للدولار صندوق مستقل اسمه <b>صندوق الدولار</b>. كل فاتورة نقدية بالدولار، وسند قبض أو دفع أو مصروف بالدولار، يدخل إليه أو يخرج منه تلقائياً. والعمليات بالليرة تمرّ على صندوق الليرة.</li>
<li>رصيده يظهر <b>بالدولار</b> وبما يعادله بالليرة (حسب سعر كل عملية) في تبويب الحسابات وفي التقارير، وكشف حسابه بالدولار مع طباعة.</li>
<li>لشراء أو بيع الدولار بالليرة استخدم <b>تصريف دولار</b> من تبويب السندات: يحرّك الصندوقين معاً.</li>
<li>الدفاتر تبقى بالليرة، فلا تنسَ تحديث سعر الدولار (زر $ أعلى الصفحة، وهو يفتح إدارة العملات).</li>
<li><b>شريط أرصدة الصناديق</b> ثابت أعلى الصفحة في كل الشاشات (لمن لديه صلاحية السندات أو التقارير أو الحسابات). يتحدّث بعد كل عملية. بدون إنترنت أو مع عمليات معلّقة ينبّهك أن الأرصدة غير محدّثة.</li></ul>`},
{t:'📝 المفكرة والمهام',o:0,h:`<ul>
<li>من <b>المزيد ← المفكرة</b> سجّل ملاحظاتك ومهامك: عنوان، وتفاصيل، وتاريخ تذكير اختياري.</li>
<li>اضغط على الملاحظة لتعديلها، وعلّمها منجزة عند انتهائها. تُرتَّب المهام غير المنجزة أولاً حسب تاريخ التذكير.</li></ul>`},
{t:'🏢 بيانات الشركة',o:1,h:`<ul>
<li>من تبويب <b>بيانات الشركة</b> (للمالك) اكتب العنوان وأرقام الهاتف وملاحظة اختيارية.</li>
<li>تظهر أعلى الفواتير والسندات وكشوف الحساب عند الطباعة، والملاحظة أسفلها.</li>
<li><b>البدء من الصفر:</b> من نفس التبويب زر <b>تصفير الشركة</b> يحذف كل العمليات (ويمكنك الاحتفاظ بقوائم المنتجات والزبائن والموردين)، ويحفظ قبله نسخة أمان تتراجع منها. وزر <b>حذف الشركة نهائياً</b> يحذف كل شيء بلا تراجع. نزّل نسخة على جهازك قبل أيٍّ منهما.</li></ul>`},
{t:'👥 المستخدمون والصلاحيات',o:1,h:`<ul>
<li>من تبويب <b>الفريق</b> (للمالك): المستخدم ينشئ حساباً بإيميله من شاشة الدخول (زر «حساب جديد»)، ثم تكتب إيميله وتضيفه.</li>
<li>اختر صلاحياته بالمربعات أو بقالب جاهز (كاشير، أمين مستودع، محاسب، مدير). الصلاحيات: البيع، رؤية كل الفواتير، تعديل وإلغاء الفواتير، الشراء، إدارة المنتجات، رؤية التكلفة، المخزون، السندات والديون، التقارير والأرباح، الحسابات، التصنيع.</li>
<li>صلاحية <b>إدارة المنتجات</b> تشمل تعريف الوحدات والعروض التجارية. أما رؤية العروض واستخدامها في الفواتير فمتاحة لمن يبيع أو يشتري.</li>
<li>تظهر لكل مستخدم التبويبات المسموحة له فقط، والمنع مطبّق من قاعدة البيانات نفسها. الفريق والنسخ الاحتياطي وبيانات الشركة والمرتجعات للمالك وحده.</li>
<li>لتثبيت مبيعات مستخدم على مستودع معين اختر مستودعه من نفس الشاشة. للتعديل لاحقاً افتح «الصلاحيات» تحت اسمه ثم احفظ.</li></ul>`},
{t:'📄 إرسال الفواتير وكشوف الحساب PDF بالواتساب',o:0,h:`<ul>
<li><b>فاتورة:</b> افتحها من تبويب الفواتير واضغط <b>📄 PDF / واتساب</b>.</li>
<li><b>كشف حساب:</b> من صفحة الزبون أو المورد (تبويب الديون) اعرض الكشف (مختصر أو تفصيلي) ثم اضغط <b>📄 إرسال PDF عبر واتساب</b>.</li>
<li>يجهّز البرنامج ملف PDF ببيانات شركتك، ثم تظهر نافذة: <b>إرسال عبر واتساب</b> (تختار واتساب ثم جهة الاتصال)، أو <b>فتح محادثة</b> الزبون برسالة جاهزة (إذا كان رقم هاتفه مسجّلاً)، أو <b>تنزيل الملف</b> لإرفاقه يدوياً.</li>
<li>واتساب لا يسمح لأي موقع بإرفاق الملف بمحادثة محددة تلقائياً، لذلك تختار جهة الاتصال بنفسك. سجّل أرقام هواتف الزبائن بالصيغة المحلية (مثل 0933...) لتعمل المحادثة المباشرة.</li>
<li>أول مرة يحتاج إنترنت لتحميل مكتبة إنشاء PDF.</li></ul>`},
{t:'📶 العمل بدون إنترنت وتثبيت التطبيق',o:0,h:`<ul>
<li>إذا انقطع الإنترنت يظهر شريط أصفر أعلى الصفحة. تتابع البيع والشراء كالمعتاد (بما في ذلك الوحدات والعروض والحسم)، وتظهر رسالة تؤكد أن الفاتورة <b>حُفظت على جهازك وستُرحَّل تلقائياً عند عودة الاتصال</b> (ويمكنك طباعة الوصل). تجد العمليات المنتظرة في تبويب الفواتير.</li>
<li><b>لا تسجّل الخروج</b> قبل أن تُرحَّل العمليات المنتظرة. وبقية الشاشات (التقارير، الحسابات، المرتجعات...) تحتاج اتصالاً.</li>
<li><b>للتثبيت كتطبيق:</b> افتح الموقع من Chrome، واضغط زر <b>📲 تثبيت التطبيق</b> أسفل الصفحة إن ظهر، أو النقاط الثلاث ثم <b>تثبيت التطبيق</b>. على الآيفون: Safari ← مشاركة ← إضافة إلى الشاشة الرئيسية.</li>
<li>إذا لم يظهر خيار التثبيت اضغط <b>فحص التثبيت</b> في آخر هذه الصفحة ليخبرك ما الناقص.</li>
<li>مسح الباركود بالكاميرا يطلب إذن الكاميرا أول مرة، ويحتاج إنترنت مرة واحدة لتحميله.</li></ul>`},
{t:'💾 النسخ الاحتياطي والاسترجاع',o:1,h:`<ul>
<li>تبويب <b>النسخ الاحتياطي</b> (للمالك): يأخذ البرنامج <b>نسخة تلقائية يومياً</b> عند فتحك له، ويحتفظ بآخر 7 نسخ.</li>
<li><b>إنشاء نسخة الآن</b> قبل أي عملية كبيرة، و<b>تنزيل على جهازي</b> لتحتفظ بملف خارج النظام (افعلها كل أسبوع).</li>
<li><b>الاسترجاع:</b> اضغط «استرجاع» بجانب النسخة، أو اختر ملفاً محفوظاً. يستبدل كل بيانات المحل ببيانات النسخة، وكل ما سُجّل بعدها يُحذف. قبل الاسترجاع يأخذ البرنامج نسخة أمان تظهر بالقائمة، فتستطيع التراجع.</li>
<li>أوقف الكاشير عن العمل أثناء الاسترجاع، وانتظر ترحيل أي عمليات بانتظار الإرسال قبله.</li>
<li>تشمل النسخة الوحدات والعروض التجارية وملاحظات البنود. تنبيه: استرجاع نسخة <b>قديمة</b> (أُخذت قبل إضافة الوحدات والعروض) يمسح الوحدات والعروض الحالية، لأن تلك النسخة لا تحتويها.</li></ul>`},
{t:'🛡️ نصائح مهمة (للمالك)',o:1,h:`<ul>
<li>نزّل <b>نسخة احتياطية</b> كل أسبوع.</li>
<li>أنشئ للكاشير حساباً خاصاً ولا تعطه حسابك.</li>
<li>راجع صندوقك وجرد بضاعتك دورياً وقارنهما بالواقع.</li>
<li>راجع حسابي <b>الحسم الممنوح</b> و<b>الحسم المكتسب</b> دورياً لتعرف كم تمنح من حسومات وكم تكسب.</li>
<li>بعد انتهاء الاشتراك تبقى بياناتك ظاهرة، لكن لا يمكن تسجيل عمليات جديدة حتى التجديد. تواصل معنا للتجديد.</li></ul>`},
{t:'❓ مشاكل شائعة وحلولها',o:0,h:`<ul>
<li><b>«الكمية غير كافية»:</b> الكمية الإجمالية للمنتج ناقصة، وتشمل الكمية المجانية من العرض. سجّل شراءً أو اعمل جرداً (للمالك)، أو قلّل الكمية، أو اضغط «عدم اعتماد العرض».</li>
<li><b>البيع الآجل يرفض:</b> اختر الزبون أو أضفه بزر ＋.</li>
<li><b>الحسم مرفوض:</b> يجب أن يكون الحسم أقل من إجمالي الفاتورة، وأن يكون المدفوع أقل من أو يساوي الصافي بعد الحسم.</li>
<li><b>لا تظهر قائمة الوحدات بجانب البند:</b> المادة ليس لها وحدات إضافية. أضفها من صفحة المادة ← وحدات الكمية.</li>
<li><b>لا يظهر 🎁 في الفاتورة:</b> تأكد أن العرض فعّال، وأنه يسري على هذا النوع من الفواتير (بيع أو شراء)، وأن الكمية وصلت لشرطه، وأنك لم تضغط «عدم اعتماد العرض» على هذا البند.</li>
<li><b>لا يظهر قسم «العروض التجارية»:</b> يظهر لمن لديه صلاحية البيع أو الشراء أو المنتجات. تجده في المزيد تحت المنتجات.</li>
<li><b>«انتهى الاشتراك»:</b> تواصل معنا عبر واتساب للتجديد.</li>
<li><b>لا يظهر المنتج بالبحث:</b> تأكد أنه غير محذوف وأن الاسم أو الباركود صحيح.</li>
<li><b>الكاميرا لا تفتح:</b> اسمح للموقع باستخدام الكاميرا من إعدادات المتصفح، وجرّب إضاءة أفضل وتقريب الباركود.</li>
<li><b>ظهرت رسالة خطأ غريبة:</b> صوّرها وأرسلها لنا عبر واتساب.</li></ul>`}
];

function guideFilter(){
  const k=nAr(($('#gs')||{}).value||'').trim();let n=0;
  document.querySelectorAll('#gl details').forEach(d=>{const hit=!k||nAr(d.textContent).includes(k);d.style.display=hit?'':'none';d.open=!!k&&hit;if(hit)n++});
  const e=$('#gn');if(e)e.style.display=n?'none':''
}

const PERMS=[['sell','البيع'],['invoices','رؤية كل الفواتير'],['edit_invoices','تعديل وإلغاء الفواتير'],['purchase','الشراء'],['products','إدارة المنتجات'],['costs','رؤية التكلفة'],['stock','المخزون والجرد والتحويل'],['vouchers','السندات والديون والمصاريف'],['reports','التقارير والأرباح'],['accounts','الحسابات والقيود'],['mfg','التصنيع']];
const PRESETS={'كاشير':['sell'],'أمين مستودع':['purchase','products','stock'],'محاسب':['invoices','vouchers','reports','accounts','costs'],'مدير':PERMS.map(p=>p[0])};
const permBoxes=(pre,sel)=>PERMS.map(([k,l])=>`<label class=m style="display:flex;gap:8px;align-items:center;margin:5px 0"><input type=checkbox class="${pre}" value="${k}" style="width:auto;margin:0" ${sel.includes(k)?'checked':''}> ${l}</label>`).join('');
const permSel=pre=>[...document.querySelectorAll('.'+pre+':checked')].map(x=>x.value);
const presetBtns=pre=>Object.keys(PRESETS).map(n=>`<button class="b s" style="padding:6px 10px" onclick="applyPreset('${pre}','${n}')">${n}</button>`).join(' ');
function applyPreset(pre,name){const p=PRESETS[name]||[];document.querySelectorAll('.'+pre).forEach(x=>x.checked=p.includes(x.value))}
async function teamV(){
  const {data,error}=await db.rpc('list_members',{p_shop:S.shop.id});
  if(error)return toast(error.message);
  $('#v').innerHTML=`<div class=card><b>إضافة مستخدم</b>
  <div class=m>يجب أن يكون المستخدم قد أنشأ حساباً بالموقع بهذا الإيميل (زر "حساب جديد").</div>
  <input id=ce type=email dir=ltr placeholder="إيميل المستخدم">
  <div class=m style="margin-top:6px">قوالب جاهزة للصلاحيات:</div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0">${presetBtns('np')}</div>
  <div>${permBoxes('np',['sell'])}</div>
  <button class=b style="width:100%;margin-top:6px" onclick="addCashier()">إضافة المستخدم</button></div>
  ${(data||[]).map(m=>{
    if(m.role=='owner')return `<div class=card><span dir=ltr>${esc(m.email)}</span><div class=m>مالك الشركة: كل الصلاحيات، والفريق والنسخ الاحتياطي وبيانات الشركة له وحده.</div></div>`;
    const pre='mp'+m.user_id.slice(0,8);
    return `<div class=card><div class=it style="border:0;padding-top:0"><span dir=ltr>${esc(m.email)}</span><button class="b s neg" style="flex:0" onclick="rmMember('${m.user_id}')">إزالة</button></div>
    ${S.whs.length>1?`<div class=m>المستودع:</div><select onchange="setMW('${m.user_id}',this.value)"><option value="">أي مستودع (يختار بنفسه)</option>${S.whs.map(w=>`<option value=${w.id} ${w.id==m.warehouse_id?'selected':''}>${esc(w.name)}`).join('')}</select>`:''}
    <details><summary>الصلاحيات (${(m.perms||[]).length})</summary>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">${presetBtns(pre)}</div>
    ${permBoxes(pre,m.perms||[])}
    <button class=b style="width:100%;margin-top:6px" onclick="saveMP('${m.user_id}')">حفظ الصلاحيات</button></details></div>`}).join('')}`
}
async function setMW(...args){return runMutationOnce('setMW',()=>_once_setMW(...args))}
async function _once_setMW(u,w){
  const r=await call('set_member_wh',{p_shop:S.shop.id,p_user:u,p_wh:w||null});
  if(r!==undefined)toast('تم الحفظ ✓')
}
async function addCashier(...args){return runMutationOnce('addCashier',()=>_once_addCashier(...args))}
async function _once_addCashier(){
  const e=$('#ce').value.trim();if(!e)return toast('اكتب إيميل المستخدم');
  const r=await call('add_cashier',{p_shop:S.shop.id,p_email:e,p_perms:permSel('np')});
  if(r!==undefined){toast('تمت الإضافة ✓');teamV()}
}
async function saveMP(...args){return runMutationOnce('saveMP',()=>_once_saveMP(...args))}
async function _once_saveMP(u){
  const r=await call('set_member_perms',{p_shop:S.shop.id,p_user:u,p_perms:permSel('mp'+u.slice(0,8))});
  if(r!==undefined){toast('تم حفظ الصلاحيات ✓');teamV()}
}
async function rmMember(...args){return runMutationOnce('rmMember',()=>_once_rmMember(...args))}
async function _once_rmMember(u){
  if(!await ok('إزالة هذا المستخدم؟',{danger:true,icon:'trash',yes:'إزالة'}))return;
  const r=await call('remove_member',{p_shop:S.shop.id,p_user:u});
  if(r!==undefined)teamV()
}

async function histV(){
  $('#v').innerHTML='<div class=m>جارٍ التحميل...</div>';
  if(!navigator.onLine){$('#v').innerHTML=pendHtml()+'<div class="card m">لا يوجد اتصال: تظهر هنا العمليات بانتظار الإرسال فقط. باقي الفواتير تظهر عند عودة الاتصال.</div>';return}
  if(!canAny(['reports','edit_invoices'])){
    const {data,error}=await db.rpc('recent_sales',{p_shop:S.shop.id,p_limit:40});
    if(error)return toast(error.message);
    S.hist=(data||[]).map(x=>({...x,kind:'sale',date:x.sale_date,partners:{name:x.partner_name}}));
    return histList()
  }
  const hq=x=>Promise.all([
    db.from('sales').select('id,sale_date,currency,rate,partner_id,total,paid,discount,voided_at,created_at,partners(name,phone),sale_items(product_id,qty,price,'+x+'products(name))').order('created_at',{ascending:false}).limit(40),
    db.from('purchases').select('id,purchase_date,currency,rate,partner_id,total,paid,discount,voided_at,created_at,partners(name,phone),purchase_items(product_id,qty,unit_cost,'+x+'products(name))').order('created_at',{ascending:false}).limit(40)]);
  let [s,p]=await hq(S.noX?'':'note,unit_name,unit_qty,');
  if((s.error||p.error)&&!S.noX){S.noX=true;[s,p]=await hq('')}
  S.hist=[...(s.data||[]).map(x=>({...x,kind:'sale',date:x.sale_date,items:x.sale_items.map(i=>({id:i.product_id,n:i.products?.name,q:i.qty,p:i.price,note:i.note,un:i.unit_name,uq:i.unit_qty}))})),
    ...(p.data||[]).map(x=>({...x,kind:'purchase',date:x.purchase_date,items:x.purchase_items.map(i=>({id:i.product_id,n:i.products?.name,q:i.qty,p:i.unit_cost,note:i.note,un:i.unit_name,uq:i.unit_qty}))}))]
    .sort((a,b)=>b.created_at.localeCompare(a.created_at)).slice(0,50);
  histList()
}

function editInv(k){
  const x=S.hist[k],rt=+x.rate;

    if(u&&!free){const f=+u.factor,uq=+i.uq;return {id:i.id,name:i.n,qty:uq,price:+(+i.q*+i.p/uq).toFixed(4),base:+i.p*rt,f,un:u.id,noOffer:true,locked:true,free:false,note:i.note||'',nt:!!i.note}}
    return {id:i.id,name:i.n,qty:+i.q,price:+i.p,base:+i.p*rt,f:1,un:null,noOffer:true,locked:true,free,note:i.note||'',nt:!!i.note}});S.disc={v:+x.discount>0?String(x.discount):'',pct:false};
  S.edit={kind:x.kind,id:x.id,date:x.date,paid:x.paid,total:x.total,partner:x.partner_id,cur:x.currency,rate:rt};
  go(S.mode)
}

const stkKey=w=>'stk_'+S.shop.id+'_'+w,stkArcKey=()=>'stkarc_'+S.shop.id;

const stkD=iso=>iso?ld(new Date(iso)):'';
const stkBase=(pid,c)=>{c=c||S.stk.cnt[pid];return c?+(c.q*unitF(pid,c.u)).toFixed(6):null};
function stkLines(){
  S.prods.forEach(p=>{if(S.stk.snap[p.id]===undefined)S.stk.snap[p.id]=lvl(p.id,S.stkWh)});
  const cs=can('costs');

}

async function stkOpen(wid){
  let d=stkRead(wid);
  if(!d){
    const l=await ask('اسم الجرد','جرد سنوي '+new Date().getFullYear(),{msg:'سيُثبَّت رصيد النظام الحالي لهذا المستودع كنقطة بداية للجرد.',icon:'stock',yes:'بدء'});
    if(!l||!String(l).trim())return;

async function _once_stkApply(){
  if(!navigator.onLine)return toast('تطبيق التسوية يحتاج اتصالاً بالإنترنت');
  if(!await ok('تطبيق تسوية الجرد؟',{msg:'ستُعدَّل كميات المخزون وتُسجَّل قيود الفروقات (عجز/زيادة) تلقائياً. للتراجع تحتاج تسوية جديدة.',danger:true,yes:'تطبيق',no:'رجوع'}))return;

  const d=S.stk,ls=stkLines().filter(l=>l.diff!==0&&!d.done[l.p.id]),tot=ls.length;let n=0;
  for(const l of ls){
    const target=Math.max(0,+(l.eff+(l.live-l.snap)).toFixed(6));

    d.applied[l.p.id]=d.applied[l.p.id]||uid();stkSave();
    toast('جارٍ التسوية '+(++n)+' من '+tot+'...');
    const r=await call('post_stock_adjust_wh',{p_wh:S.stkWh,p_shop:S.shop.id,p_client:d.applied[l.p.id],p_product:l.p.id,p_new_qty:target,p_reason:'جرد سنوي: '+d.label});
    if(r===undefined){stkSave();return toast('توقّفت التسوية عند «'+l.p.name+'». ما طُبّق محفوظ؛ أعد المحاولة لإكمال الباقي.')}
    d.done[l.p.id]=1;stkSave()
  }
  await refresh();stkFinish()
}

const WAT0='مرحباً {الاسم}،\nنودّ تذكيركم بأن الرصيد المستحق عليكم لدى {المحل} هو {المبلغ} حتى تاريخ {التاريخ}.\nنرجو التكرّم بتسديده في أقرب وقت، وشكراً لتعاملكم معنا.\n{هاتف_المحل}';

/* يجلب آخر تذكير لكل زبون من الخادم (مشترك بين كل الأجهزة) */
async function rlLoad(force){
  if(!S.shop||!navigator.onLine||(!force&&Date.now()-RLT<30e3))return;RLT=Date.now();
  const sid=S.shop.id,since=new Date(Date.now()-365*864e5).toISOString();
  const {data,error}=await db.from('debt_reminders').select('partner_id,sent_at').eq('shop_id',sid).gte('sent_at',since).order('sent_at',{ascending:false}).limit(10000).then(r=>r,e=>({error:e}));
  if(!S.shop||S.shop.id!==sid)return;
  if(error){S.rlOff=true;return}
  S.rlOff=false;
  const m={},up=(p,t)=>{if(!m[p]||m[p]<t)m[p]=t};
  (data||[]).forEach(x=>up(x.partner_id,+new Date(x.sent_at)));
  /* ترحيل التذكيرات القديمة المحفوظة على هذا الجهاز مرة واحدة */
  if(!localStorage['rlmig'+sid]){const old=jget('rl'+sid,{}),q=rlQ();
    Object.entries(old).forEach(([p,t])=>{if(!(m[p]>=t)&&S.parts.some(x=>x.id==p))q.push({p,t})});
    localStorage['rlq'+sid]=JSON.stringify(q);localStorage['rlmig'+sid]=1}
  rlQ().forEach(x=>up(x.p,x.t));
  S.rl=m;try{localStorage['rl'+sid]=JSON.stringify(m)}catch(e){}
  rlPaint();rlFlush();
  /* ترحيل نص الرسالة المحفوظ محلياً إلى المحل */
  const lt=localStorage['wat'+sid];
  if(lt&&S.role=='owner'&&'wa_template' in S.shop&&!S.shop.wa_template){const r=await db.rpc('set_wa_template',{p_shop:sid,p_text:lt}).then(r=>r,e=>({error:e}));if(!r.error){S.shop.wa_template=lt;localStorage.removeItem('wat'+sid)}}
}
/* يرسل التذكيرات المعلّقة (تُحفظ محلياً إن لم يتوفر اتصال) */
async function rlFlush(){
  if(RLF||!S.shop||!navigator.onLine)return;const sid=S.shop.id,q=rlQ();if(!q.length)return;
  RLF=true;
  try{const {error}=await db.from('debt_reminders').insert(q.map(x=>({shop_id:sid,partner_id:x.p,sent_at:new Date(x.t).toISOString(),amount:x.a??null}))).then(r=>r,e=>({error:e}));
    if(!error){const n=rlQ().slice(q.length);localStorage['rlq'+sid]=JSON.stringify(n);S.rlOff=false}
    else{S.rlOff=true;if(!bad(error)&&!/42P01|PGRST20/.test(error.code||'')&&!/schema cache|does not exist/i.test(error.message||'')){localStorage['rlq'+sid]='[]';toast('رفض الخادم حفظ التذكير: '+error.message)}}
  }finally{RLF=false}
}
function rlPaint(){document.querySelectorAll('[data-rl]').forEach(e=>{const t=rlTxt(e.dataset.rl);if(t){e.textContent=t;e.classList.add('sent')}})}

const rlTxt=id=>{const t=RL()[id];if(!t)return '';const d=Math.floor((new Date(new Date().toDateString())-new Date(new Date(t).toDateString()))/864e5);return 'ذُكّر '+(d<=0?'اليوم':d==1?'أمس':d==2?'قبل يومين':d<=10?'قبل '+d+' أيام':'قبل '+d+' يوماً')};

async function balOf(id){
  const c=(S.balc=S.balc||{})[id];if(c&&c.usd!==undefined)return c;
  const [a,b]=await Promise.all([db.from('partner_balances').select('receivable,payable').eq('id',id).single(),db.from('partner_cur_balances').select('*').eq('partner_id',id).maybeSingle().then(r=>r,()=>({}))]);
  if(a.error&&!c)return null;
  return S.balc[id]={r:a.data?+a.data.receivable:c.r,pa:a.data?+a.data.payable:c.pa,usd:b&&b.data?+b.data.rec_usd||0:0}}
async function remind(id){
  const p=S.parts.find(x=>x.id==id);if(!p)return;
  const b=await balOf(id);if(!b)return toast('تعذّر جلب الرصيد، تحقق من الاتصال');
  if(!(b.r>0))return toast('لا يوجد رصيد مستحق على '+p.name);
  let ph=p.phone;
  if(!phOk(ph)){
    const f=await dlg({title:'رقم واتساب '+p.name,msg:'لا يوجد رقم هاتف صحيح محفوظ لهذا الزبون. سيُحفظ الرقم في بياناته.',icon:'wa',yes:'حفظ وإرسال',fields:[{k:'ph',label:'رقم الهاتف',tel:true,val:ph||'',ph:'09xxxxxxxx'}],check:v=>phOk(v.ph)?'':'أدخل رقماً صحيحاً، مثل 0933123456'});
    if(!f)return;ph=f.ph.trim();p.phone=ph;
    db.from('partners').update({phone:ph}).eq('id',id).then(({error})=>{if(error)toast('لم يُحفظ الرقم: '+error.message)})}
  const url='https://wa.me/'+waNum(ph)+'?text='+encodeURIComponent(waMsg(p,b.r,b.usd));
  const w=open(url,'_blank');if(!w)location.href=url;
  const now=Date.now(),L=RL();L[id]=now;try{localStorage['rl'+S.shop.id]=JSON.stringify(L)}catch(e){}
  const q=rlQ();q.push({p:id,t:now,a:b.r});localStorage['rlq'+S.shop.id]=JSON.stringify(q);rlFlush();
  document.querySelectorAll(`[data-rl="${id}"]`).forEach(e=>{e.textContent=rlTxt(id);e.classList.add('sent')});
}

async function loadPeriod(n,from,to){

async function all(t,cols='*',ord=['id']){
  let o=[],i=0;
  for(;;){
    let q=db.from(t).select(cols);ord.forEach(c=>q=q.order(c));
    const {data,error}=await q.range(i,i+999);
    if(error)throw new Error(t+': '+error.message);
    o=o.concat(data);if(data.length<1000)return o;i+=1000
  }
}

const mutationLocks=new Set();
async function runMutationOnce(name,work){
 if(mutationLocks.has(name)){toast('هذه العملية قيد التنفيذ؛ انتظر اكتمالها');return}
 mutationLocks.add(name);
 const buttons=[...document.querySelectorAll('button[onclick],input[type=button][onclick],input[type=submit][onclick]')].filter(b=>(b.getAttribute('onclick')||'').includes(name+'('));
 const states=buttons.map(b=>[b,b.disabled,b.getAttribute('aria-busy')]);
 states.forEach(([b])=>{b.disabled=true;b.setAttribute('aria-busy','true')});
 try{return await work()}
 catch(e){console.error('Operation failed: '+name,e);toast('تعذر إكمال العملية. تحقق من السجل والعمليات المعلّقة قبل إعادة المحاولة.');}
 finally{mutationLocks.delete(name);states.forEach(([b,disabled,busy])=>{if(!b.isConnected)return;b.disabled=disabled;if(busy===null)b.removeAttribute('aria-busy');else b.setAttribute('aria-busy',busy)})}
}

function returnValues(){
 const d=S.returnDraft;if(!d)throw Error('افتح نموذج المرتجع أولاً');let total=0;
 const round=n=>Math.round((n+Number.EPSILON)*100)/100;
 const items=d.lines.flatMap((i,j)=>{const q=Number($('#retq'+j).value);if(!Number.isFinite(q)||q<0||q>i.remaining+1e-9)throw Error('كمية غير صالحة في أحد البنود');if(!q)return [];
 const orig=round(Number(i.qty)*i.unit);total+=round(orig*(i.prev+q)/Number(i.qty))-round(orig*i.prev/Number(i.qty));return [{item_id:i.id,qty:q}]});
 return {items,total:round(total)};
}

 if(!date)return toast('حدد تاريخ المرتجع');

 const args={p_shop:S.shop.id,p_client:uid(),p_kind:d.invoice.kind,p_invoice:d.invoice.id,p_items:v.items,p_cash:cash,p_date:date,p_note:$('#returnNote').value.trim()||null};
