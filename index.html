<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محاسبة المحل</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f7b4f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--c:#fff;--t:#1b1f24;--m:#6b7280;--p:#0f7b4f;--b:#e5e7eb;--r:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--c:#1e2327;--t:#e8eaed;--m:#9aa3ad;--b:#2d343a}}
*{box-sizing:border-box}
body{margin:0;font:15px system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--c);border-bottom:1px solid var(--b)}
nav{display:flex;overflow-x:auto;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:0}
nav button{flex:1;min-width:72px;padding:11px 6px;border:0;background:none;color:var(--m);font:inherit;border-bottom:3px solid transparent}
nav button.on{color:var(--p);border-color:var(--p);font-weight:700}
main{padding:12px;max-width:720px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:12px}
input,select{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit;margin:4px 0}
button.b{padding:10px 14px;border:0;border-radius:8px;background:var(--p);color:#fff;font:inherit;font-weight:700}
button.b.s{background:var(--b);color:var(--t)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--b)}
.m{color:var(--m);font-size:13px}.neg{color:var(--r)}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--b);text-align:start;font-size:13px}
.strike{text-decoration:line-through}.ok{color:var(--p)}
#rcpt{display:none}
@media print{body>*:not(#rcpt){display:none!important}#rcpt{display:block;width:72mm;font:12px system-ui,Tahoma,sans-serif;color:#000}}
#toast{position:fixed;bottom:16px;left:12px;right:12px;background:#222;color:#fff;padding:12px;border-radius:10px;display:none;z-index:9}
</style>
</head>
<body>
<div id="app"></div>
<div id="rcpt"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const URL_='https://xeeqyedzueuzdlfsqjyh.supabase.co',KEY='sb_publishable_mELxzgngQxrZ3JZuyNJqGg_Aw7jGUEg';
const db=supabase.createClient(URL_,KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en',{maximumFractionDigits:2});
const uid=()=>crypto.randomUUID();
let S={shop:null,prods:[],parts:[],cart:[],cur:'SYP',mode:'sale',tab:'sale',wh:localStorage.wh||null,whs:[],lv:{}};
const lvl=(p,w)=>S.lv[p+'|'+w]||0;
const rate=c=>c==='USD'?+S.shop.usd_rate:1;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',4500)}

/* ---- الاتصال بالدوال + طابور الإرسال عند انقطاع الإنترنت ---- */
const bad=e=>!navigator.onLine||/fetch|network/i.test((e&&e.message)||'');
const ld=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>ld(new Date());
async function call(fn,args,q){
  if(/^(post_|record_)/.test(fn)&&!args.p_date)args.p_date=today();
  const {data,error}=await db.rpc(fn,args).then(r=>r,e=>({error:e}));
  if(!error)return data||1;
  if(q&&bad(error)){const Q=JSON.parse(localStorage.q||'[]');Q.push({fn,args});localStorage.q=JSON.stringify(Q);return null}
  toast(/stock_levels|check constraint/.test(error.message)?'الكمية غير كافية في هذا المستودع':error.message)
}
async function flush(){
  const Q=JSON.parse(localStorage.q||'[]');if(!Q.length||!navigator.onLine)return;
  const keep=[];
  for(const x of Q){
    const {error}=await db.rpc(x.fn,x.args);
    if(error&&bad(error))keep.push(x);
    else if(error){localStorage.f=JSON.stringify([...JSON.parse(localStorage.f||'[]'),x]);toast('عملية مؤجلة رُفضت: '+error.message)}
  }
  localStorage.q=JSON.stringify(keep);
  if(S.shop)await refresh();
}
addEventListener('online',flush);

/* ---- الدخول ---- */
async function boot(){const {data:{session}}=await db.auth.getSession();session?load():authView()}
function authView(){
  $('#app').innerHTML=`<main><div class=card><h2>محاسبة المحل</h2>
  <input id=em type=email dir=ltr placeholder="الإيميل"><input id=pw type=password dir=ltr placeholder="كلمة السر (6 أحرف على الأقل)">
  <div class=row><button class=b onclick="auth(0)">دخول</button><button class="b s" onclick="auth(1)">حساب جديد</button></div></div></main>`
}
async function auth(up){
  const e=$('#em').value.trim(),p=$('#pw').value;
  const {data,error}=up?await db.auth.signUp({email:e,password:p}):await db.auth.signInWithPassword({email:e,password:p});
  if(error)return toast(error.message);
  if(!data.session)return toast('تحقق من إيميلك لتأكيد الحساب');
  load()
}
async function load(){
  const {data}=await db.from('shops').select('*').limit(1);
  if(!data||!data.length)return newShopView();
  S.shop=data[0];
  const {data:{user}}=await db.auth.getUser();
  const m=await db.from('shop_members').select('role').eq('shop_id',S.shop.id).eq('user_id',user.id).single();
  S.role=(m.data||{}).role||'cashier';
  await refresh();flush();shell()
}
async function refresh(){
  const [a,b,c]=await Promise.all([
    db.from('products').select('id,shop_id,name,barcode,unit,sale_price,sale_currency,stock_qty,min_stock,active').eq('active',true).order('name'),
    db.from('partners').select('*').order('name'),
    db.from('shops').select('*').eq('id',S.shop.id).single()]);
  S.prods=a.data||[];S.parts=b.data||[];if(c.data)S.shop=c.data;
  const cm={};
  if(S.role=='owner'){const r=await db.rpc('product_costs',{p_shop:S.shop.id});(r.data||[]).forEach(x=>cm[x.id]=+x.avg_cost)}
  S.prods.forEach(p=>p.avg_cost=cm[p.id]||0);
  S.bom=[];
  if(S.role=='owner'){const bb=await db.from('bom_items').select('product_id,component_id,qty');S.bom=bb.data||[]}
  const [w,l]=await Promise.all([
    db.from('warehouses').select('id,name,is_default').order('created_at'),
    db.from('stock_levels').select('product_id,warehouse_id,qty')]);
  S.whs=w.data||[];S.lv={};
  (l.data||[]).forEach(x=>S.lv[x.product_id+'|'+x.warehouse_id]=+x.qty);
  if(!S.whs.find(x=>x.id==S.wh))S.wh=(S.whs.find(x=>x.is_default)||S.whs[0]||{}).id||null
}
function newShopView(){
  $('#app').innerHTML=`<main><div class=card><h3>أنشئ محلك</h3><input id=sn placeholder="اسم المحل">
  <button class=b onclick="mk()">إنشاء (تجربة 14 يوماً)</button></div>
  <div class=card><div class=m>إذا كنت كاشيراً: اطلب من المالك إضافة إيميلك، ثم اضغط تحديث.</div>
  <button class="b s" style="width:100%;margin-top:8px" onclick="load()">تحديث</button></div></main>`
}
async function mk(){const n=$('#sn').value.trim();if(!n)return;const r=await call('create_shop',{p_name:n});if(r!==undefined)load()}

/* ---- الهيكل ---- */
const TABS={sale:'بيع',buy:'شراء',hist:'الفواتير',prod:'المنتجات',debt:'الديون',rep:'التقارير',stock:'المخزون',team:'الفريق',mfg:'التصنيع',open:'افتتاحي'};
function shell(){
  const exp=new Date(S.shop.subscription_until)<new Date(new Date().toDateString());
  $('#app').innerHTML=`<header><div><b>${esc(S.shop.name)}</b><br><span class="m ${exp?'neg':''}">${exp?'انتهى الاشتراك':'الاشتراك حتى '+S.shop.subscription_until}</span></div>
  ${S.role=='owner'?`<button class="b s" onclick="setRate()">$ = ${fmt(S.shop.usd_rate)}</button>`:`<span class=m>$ = ${fmt(S.shop.usd_rate)}</span>`}
  <button class="b s" onclick="db.auth.signOut().then(()=>location.reload())">خروج</button></header>
  <nav>${Object.entries(TABS).filter(([k])=>k!='open'&&(S.role=='owner'||k=='sale'||k=='prod')).map(([k,v])=>`<button data-k=${k} onclick="go('${k}')">${v}</button>`).join('')}</nav><main id=v></main>`;
  go(S.tab)
}
function go(k){
  S.tab=k;
  if(k=='sale'||k=='buy'||k=='open'){if(S.mode!==k)S.cart=[];S.mode=k}
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));
  ({sale:inv,buy:inv,hist:histV,team:teamV,stock:stockV,mfg:mfgV,open:inv,prod:prodV,debt:debtV,rep:repV})[k]()
}
async function setRate(){
  const v=prompt('سعر الدولار بالليرة',S.shop.usd_rate);if(!v)return;
  const r=await call('set_usd_rate',{p_shop:S.shop.id,p_rate:+v});
  if(r!==undefined){await refresh();shell();toast('تم تحديث سعر الدولار')}
}

/* ---- فاتورة بيع / شراء ---- */
function inv(){
  const sale=S.mode=='sale',list=S.parts.filter(p=>p.kind==(sale?'customer':'supplier'));
  $('#v').innerHTML=`<div class=card><input id=q placeholder="ابحث بالاسم أو امسح الباركود" oninput="srch()" onkeydown="if(event.key=='Enter')pickBar()"><div id=res></div></div>
  <div class=card><div id=cart></div>
  ${S.whs.length>1?`<select id=wh onchange="S.wh=this.value;localStorage.wh=S.wh;srch()">${S.whs.map(w=>`<option value=${w.id} ${w.id==S.wh?'selected':''}>${esc(w.name)}`).join('')}</select>`:''}
  <div class=row><select id=cur onchange="setCur(this.value)"><option>SYP<option>USD</select>
  <select id=pt><option value="">${sale?'بدون زبون (نقدي)':'اختر المورد (للآجل)'}${list.map(p=>`<option value=${p.id}>${esc(p.name)}`).join('')}</select></div>
  <input id=paid type=number inputmode=decimal placeholder="المدفوع (فارغ = الكل نقداً)">
  <button class=b style="width:100%" onclick="post()">${sale?'تسجيل البيع':'تسجيل الشراء'}</button></div>`;
  $('#cur').value=S.cur;cartV();srch();
  if(S.mode=='open'){$('#pt').style.display='none';$('#paid').style.display='none';document.querySelector('button[onclick="post()"]').textContent='تسجيل المخزون الافتتاحي'}
}
function srch(){
  const q=($('#q').value||'').trim().toLowerCase();
  const r=S.prods.filter(p=>!q||p.name.toLowerCase().includes(q)||p.barcode===q).slice(0,8);
  $('#res').innerHTML=r.map(p=>`<div class=it onclick="add('${p.id}')"><span>${esc(p.name)}<br><span class=m>المخزون ${fmt(lvl(p.id,S.wh))}</span></span><b>${fmt(p.sale_price)} ${p.sale_currency}</b></div>`).join('')||'<div class=m>لا نتائج</div>'
}
function pickBar(){const q=$('#q').value.trim(),p=S.prods.find(x=>x.barcode===q);if(p){add(p.id);$('#q').value='';srch()}}
function add(id){
  const p=S.prods.find(x=>x.id==id),c=S.cart.find(x=>x.id==id);
  if(c){c.qty++;return cartV()}
  const base=S.mode=='sale'?p.sale_price*rate(p.sale_currency):+p.avg_cost;
  S.cart.push({id,name:p.name,qty:1,base,price:+(base/rate(S.cur)).toFixed(4)});cartV()
}
function setCur(c){S.cur=c;S.cart.forEach(i=>i.price=+(i.base/rate(c)).toFixed(4));cartV()}
const tot=()=>Math.round(S.cart.reduce((s,i)=>s+Math.round(i.qty*i.price*100)/100,0)*100)/100;
function cartV(){
  $('#cart').innerHTML=S.cart.map((i,k)=>`<div class=it><div style="flex:2">${esc(i.name)}</div>
  <input style="flex:1" type=number inputmode=decimal value="${i.qty}" onchange="S.cart[${k}].qty=+this.value;cartV()">
  <input style="flex:1.4" type=number inputmode=decimal value="${i.price}" onchange="S.cart[${k}].price=+this.value;cartV()">
  <button class="b s" style="flex:0" onclick="S.cart.splice(${k},1);cartV()">✕</button></div>`).join('')
  +`<h3>الإجمالي: ${fmt(tot())} ${S.cur}</h3>`
}
async function post(){
  if(!S.cart.length)return toast('الفاتورة فارغة');
  if(S.mode=='open')return postOpen();
  const sale=S.mode=='sale',t=tot(),pv=$('#paid').value,paid=pv===''?t:+pv;
  const args={p_shop:S.shop.id,p_client:uid(),p_partner:$('#pt').value||null,p_currency:S.cur,p_rate:rate(S.cur),
    p_items:S.cart.map(i=>sale?{product_id:i.id,qty:i.qty,price:i.price}:{product_id:i.id,qty:i.qty,unit_cost:i.price}),p_paid:paid};
  args.p_wh=S.wh;
  const r=await call(sale?'post_sale_wh':'post_purchase_wh',args,true);
  if(r===undefined)return;
  S.cart=[];await refresh();
  toast(r?'تم التسجيل ✓':'لا يوجد إنترنت: حُفظت العملية وسترسل تلقائياً');
  inv()
}

/* ---- المخزون والجرد ---- */
function stockV(){
  const o=S.whs.map(w=>`<option value=${w.id}>${esc(w.name)}`).join(''),po=S.prods.map(p=>`<option value=${p.id}>${esc(p.name)}`).join('');
  $('#v').innerHTML=`<div class=card><b>المستودعات</b>
  <select id=sw onchange="S.wh=this.value;localStorage.wh=S.wh;stockList()">${S.whs.map(w=>`<option value=${w.id} ${w.id==S.wh?'selected':''}>${esc(w.name)}`).join('')}</select>
  <div class=m>المستودع المحدد هو الذي تُسجَّل عليه الفواتير والجرد.</div>
  <button class="b s" style="width:100%;margin-top:6px" onclick="addWh()">+ مستودع جديد</button>
  ${S.whs.length>1&&S.prods.length?`<hr><b>تحويل بضاعة بين مستودعين</b><div class=row><select id=tf>${o}</select><select id=tt>${o}</select></div>
  <select id=tp>${po}</select><input id=tq type=number inputmode=decimal placeholder="الكمية"><button class=b style="width:100%" onclick="doTransfer()">تحويل</button>`:''}</div>
  <div class=card><b>تهيئة محل قائم</b><div class=m>إذا كان عندك بضاعة موجودة من قبل، سجّلها كرصيد افتتاحي (لا يؤثر على الصندوق) في المستودع المحدد.</div>
  <button class=b style="width:100%;margin-top:6px" onclick="go('open')">تسجيل مخزون افتتاحي</button></div>
  <div class=card><b>جرد وتسوية الكميات</b><div class=m>اضغط على المنتج وأدخل الكمية الفعلية الموجودة في المستودع المحدد</div>
  <input id=sq placeholder="بحث" oninput="stockList()"><div id=sl></div></div>`;
  stockList()
}
function stockList(){
  const q=($('#sq').value||'').trim().toLowerCase();
  $('#sl').innerHTML=S.prods.filter(p=>!q||p.name.toLowerCase().includes(q)).map(p=>`<div class=it onclick="adjust('${p.id}')"><span>${esc(p.name)}<br><span class=m>الإجمالي بكل المستودعات ${fmt(p.stock_qty)}</span></span><b>${fmt(lvl(p.id,S.wh))}</b></div>`).join('')||'<div class=m>لا نتائج</div>'
}
async function adjust(id){
  const p=S.prods.find(x=>x.id==id),cur=lvl(id,S.wh),v=prompt('الكمية الفعلية لـ "'+p.name+'" بهذا المستودع (النظام: '+fmt(cur)+')',cur);
  if(v===null||v===''||isNaN(+v)||+v<0)return;
  const r=await call('post_stock_adjust_wh',{p_wh:S.wh,p_shop:S.shop.id,p_client:uid(),p_product:id,p_new_qty:+v,p_reason:'جرد'});
  if(r!==undefined){await refresh();toast('تمت التسوية ✓');stockV()}
}
async function addWh(){
  const n=prompt('اسم المستودع الجديد');if(!n||!n.trim())return;
  const r=await call('add_warehouse',{p_shop:S.shop.id,p_name:n});
  if(r!==undefined){await refresh();toast('تمت الإضافة ✓');stockV()}
}
async function doTransfer(){
  const q=+$('#tq').value;if(!(q>0))return toast('أدخل الكمية');
  const r=await call('transfer_stock',{p_shop:S.shop.id,p_client:uid(),p_product:$('#tp').value,p_from:$('#tf').value,p_to:$('#tt').value,p_qty:q});
  if(r!==undefined){await refresh();toast('تم التحويل ✓');stockV()}
}
async function postOpen(){
  const r=await call('post_opening_stock_wh',{p_wh:S.wh,p_shop:S.shop.id,p_client:uid(),p_currency:S.cur,p_rate:rate(S.cur),p_items:S.cart.map(i=>({product_id:i.id,qty:i.qty,unit_cost:i.price}))},true);
  if(r===undefined)return;
  S.cart=[];await refresh();toast('تم تسجيل المخزون الافتتاحي ✓');go('stock')
}

/* ---- تفاصيل الزبون/المورد وكشف الحساب ---- */
async function partnerV(id){
  const p=S.parts.find(x=>x.id==id),c=p.kind=='customer';
  const {data,error}=await db.rpc('partner_statement',{p_shop:S.shop.id,p_partner:id});
  if(error)return toast(error.message);
  S.stm=data||[];S.stp=p;
  const bal=S.stm.length?+S.stm[S.stm.length-1].balance:0,v=c?bal:-bal;
  $('#v').innerHTML=`<div class=card><b>${esc(p.name)}</b> <span class=m>${c?'زبون':'مورد'}</span>
  <h3 class="${v>0?'neg':''}">${c?'عليه':'علينا'}: ${fmt(v)}</h3>
  <div class=row><button class=b onclick="pay('${id}','${c?'receipt':'payment'}')">${c?'سند قبض':'سند دفع'}</button><button class="b s" onclick="openBal('${id}')">رصيد افتتاحي</button></div>
  <div class=row style="margin-top:8px"><button class="b s" onclick="printStm()">طباعة الكشف</button><button class="b s" onclick="debtV()">رجوع</button></div></div>
  <div class=card><b>كشف الحساب</b>${S.stm.map(x=>{const up=c?+x.debit:+x.credit,dn=c?+x.credit:+x.debit;
  return `<div class=it><span>${x.entry_date}<br><span class=m>${esc(x.description||'')}</span></span><span style="text-align:end">${up>0?'<span class=neg>+'+fmt(up)+'</span>':'<span class=ok>-'+fmt(dn)+'</span>'}<br><span class=m>${fmt(c?x.balance:-x.balance)}</span></span></div>`}).join('')||'<div class=m>لا حركات</div>'}</div>`
}
async function openBal(id){
  const a=prompt('الرصيد الافتتاحي (المبلغ المستحق سابقاً)');if(!a||isNaN(+a)||+a<=0)return;
  const cur=confirm('بالدولار؟ (موافق = دولار، إلغاء = ليرة)')?'USD':'SYP';
  const r=await call('post_opening_partner',{p_shop:S.shop.id,p_client:uid(),p_partner:id,p_amount:+a,p_currency:cur,p_rate:rate(cur)},true);
  if(r!==undefined){toast('تم ✓');partnerV(id)}
}
function printStm(){
  const p=S.stp,c=p.kind=='customer',last=S.stm.length?+S.stm[S.stm.length-1].balance:0;
  $('#rcpt').innerHTML=`<h3 style="text-align:center;margin:0">${esc(S.shop.name)}</h3><div style="text-align:center">كشف حساب: ${esc(p.name)}</div><hr>
  <table>${S.stm.map(x=>`<tr><td>${x.entry_date}<td>${esc(x.description||'')}<td>${fmt(c?x.balance:-x.balance)}`).join('')}</table><hr>
  <b>الرصيد: ${fmt(c?last:-last)}</b>`;
  print()
}

/* ---- التصنيع ---- */
const pname=id=>(S.prods.find(p=>p.id==id)||{name:'؟'}).name;
function mfgV(){
  const withB=[...new Set(S.bom.map(b=>b.product_id))],po=S.prods.map(p=>`<option value=${p.id}>${esc(p.name)}`).join('');
  $('#v').innerHTML=`<div class=card><b>تنفيذ تصنيع</b>
  <div class=m>المستودع: ${esc((S.whs.find(w=>w.id==S.wh)||{}).name||'')} (تُخصم منه المواد ويُضاف إليه المنتج)</div>
  ${withB.length?`<select id=mp onchange="mfgPrev()">${withB.map(id=>`<option value=${id}>${esc(pname(id))}`).join('')}</select>
  <input id=mq type=number inputmode=decimal placeholder="الكمية المنتَجة" oninput="mfgPrev()">
  <input id=mx type=number inputmode=decimal placeholder="مصاريف إضافية بالليرة (أجور، كهرباء) - اختياري" oninput="mfgPrev()">
  <div id=mprev></div><button class=b style="width:100%;margin-top:6px" onclick="doProd()">تنفيذ التصنيع</button>`:'<div class=m>أنشئ وصفة تصنيع أولاً من البطاقة التالية.</div>'}</div>
  <div class=card><b>وصفة تصنيع</b><div class=m>اختر المنتج الجاهز، ثم أضف المواد اللازمة لإنتاج وحدة واحدة منه.</div>
  <select id=rp onchange="rcpLoad()">${po}</select><div id=rc></div>
  <div class=row><select id=rcs>${po}</select><input id=rcq type=number inputmode=decimal placeholder="الكمية لكل وحدة"></div>
  <div class=row><button class="b s" onclick="rcpAdd()">+ مكوّن</button><button class=b onclick="rcpSave()">حفظ الوصفة</button></div></div>`;
  if(withB.length)mfgPrev();
  if(S.prods.length)rcpLoad()
}
function mfgPrev(){
  const id=$('#mp').value,q=+$('#mq').value||0,x=+$('#mx').value||0;
  let mat=0;
  const rows=S.bom.filter(b=>b.product_id==id).map(b=>{
    const p=S.prods.find(z=>z.id==b.component_id)||{},n=+b.qty*q,have=lvl(b.component_id,S.wh);
    mat+=n*(p.avg_cost||0);
    return `<div class=it><span>${esc(p.name)}</span><span class="${have<n?'neg':''}">${fmt(n)} / متوفر ${fmt(have)}</span></div>`});
  $('#mprev').innerHTML=rows.join('')+`<div class=it><span>تكلفة المواد</span><b>${fmt(mat)}</b></div>
  <div class=it><span>تكلفة الوحدة التقريبية</span><b>${q?fmt((mat+x)/q):'-'}</b></div>`
}
async function doProd(){
  const id=$('#mp').value,q=+$('#mq').value;
  if(!id||!(q>0))return toast('اختر المنتج وأدخل الكمية');
  const r=await call('post_production',{p_wh:S.wh,p_shop:S.shop.id,p_client:uid(),p_product:id,p_qty:q,p_extra:+$('#mx').value||0});
  if(r!==undefined){await refresh();toast('تم التصنيع ✓');mfgV()}
}
function rcpLoad(){
  S.rc=S.bom.filter(b=>b.product_id==$('#rp').value).map(b=>({id:b.component_id,qty:+b.qty}));rcpDraw()
}
function rcpDraw(){
  $('#rc').innerHTML=S.rc.map((x,k)=>`<div class=it><span>${esc(pname(x.id))}</span><span>${fmt(x.qty)} <button class="b s" style="padding:4px 10px" onclick="S.rc.splice(${k},1);rcpDraw()">✕</button></span></div>`).join('')||'<div class=m>لا مكونات بعد</div>'
}
function rcpAdd(){
  const id=$('#rcs').value,q=+$('#rcq').value;
  if(!(q>0))return toast('أدخل الكمية');
  if(id==$('#rp').value)return toast('المنتج لا يكون مكوّناً لنفسه');
  const e=S.rc.find(x=>x.id==id);e?e.qty+=q:S.rc.push({id,qty:q});
  $('#rcq').value='';rcpDraw()
}
async function rcpSave(){
  const r=await call('set_bom',{p_shop:S.shop.id,p_product:$('#rp').value,p_items:S.rc.map(x=>({component_id:x.id,qty:x.qty}))});
  if(r!==undefined){await refresh();toast('تم حفظ الوصفة ✓');mfgV()}
}

/* ---- الفريق ---- */
async function teamV(){
  const {data,error}=await db.rpc('list_members',{p_shop:S.shop.id});
  if(error)return toast(error.message);
  $('#v').innerHTML=`<div class=card><b>إضافة كاشير</b><div class=m>يجب أن يكون قد أنشأ حساباً بالموقع بهذا الإيميل</div>
  <input id=ce type=email dir=ltr placeholder="إيميل الكاشير"><button class=b style="width:100%" onclick="addCashier()">إضافة</button></div>
  <div class=card>${(data||[]).map(m=>`<div class=it><span dir=ltr>${esc(m.email)}<br><span class=m>${m.role=='owner'?'مالك':'كاشير'}</span></span>${m.role=='owner'?'':`<button class="b s neg" style="flex:0" onclick="rmMember('${m.user_id}')">إزالة</button>`}</div>`).join('')}</div>`
}
async function addCashier(){
  const e=$('#ce').value.trim();if(!e)return;
  const r=await call('add_cashier',{p_shop:S.shop.id,p_email:e});
  if(r!==undefined){toast('تمت الإضافة ✓');teamV()}
}
async function rmMember(u){
  if(!confirm('إزالة هذا الكاشير؟'))return;
  const r=await call('remove_member',{p_shop:S.shop.id,p_user:u});
  if(r!==undefined)teamV()
}

/* ---- سجل الفواتير ---- */
async function histV(){
  $('#v').innerHTML='<div class=m>جارٍ التحميل...</div>';
  const [s,p]=await Promise.all([
    db.from('sales').select('id,sale_date,currency,total,paid,voided_at,created_at,partners(name),sale_items(qty,price,products(name))').order('created_at',{ascending:false}).limit(40),
    db.from('purchases').select('id,purchase_date,currency,total,paid,voided_at,created_at,partners(name),purchase_items(qty,unit_cost,products(name))').order('created_at',{ascending:false}).limit(40)]);
  S.hist=[...(s.data||[]).map(x=>({...x,kind:'sale',date:x.sale_date,items:x.sale_items.map(i=>({n:i.products?.name,q:i.qty,p:i.price}))})),
    ...(p.data||[]).map(x=>({...x,kind:'purchase',date:x.purchase_date,items:x.purchase_items.map(i=>({n:i.products?.name,q:i.qty,p:i.unit_cost}))}))]
    .sort((a,b)=>b.created_at.localeCompare(a.created_at)).slice(0,50);
  $('#v').innerHTML=`<div class=card>${S.hist.map((x,k)=>`<div class=it onclick="showInv(${k})"><span>${x.kind=='sale'?'بيع':'شراء'} · ${x.date}<br><span class=m>${esc(x.partners?.name||'نقدي')}${x.paid<x.total?' · متبقي '+fmt(x.total-x.paid):''}</span></span><b class="${x.voided_at?'neg strike':''}">${fmt(x.total)} ${x.currency}${x.voided_at?' (ملغاة)':''}</b></div>`).join('')||'<div class=m>لا فواتير بعد</div>'}</div>`
}
function showInv(k){
  const x=S.hist[k];
  $('#v').innerHTML=`<div class=card><b>${x.kind=='sale'?'فاتورة بيع':'فاتورة شراء'} · ${x.date}</b>
  <div class=m>${esc(x.partners?.name||'نقدي')}${x.voided_at?' · <span class=neg>ملغاة</span>':''}</div>
  ${x.items.map(i=>`<div class=it><span>${esc(i.n)}<br><span class=m>${fmt(i.q)} × ${fmt(i.p)}</span></span><b>${fmt(i.q*i.p)}</b></div>`).join('')}
  <h3>الإجمالي: ${fmt(x.total)} ${x.currency}</h3><div class=m>المدفوع: ${fmt(x.paid)} · المتبقي: ${fmt(x.total-x.paid)}</div>
  <div class=row style="margin-top:10px"><button class=b onclick="printInv(${k})">طباعة</button>${x.voided_at?'':`<button class="b s neg" onclick="voidInv(${k})">إلغاء الفاتورة</button>`}<button class="b s" onclick="histV()">رجوع</button></div></div>`
}
async function voidInv(k){
  const x=S.hist[k];
  if(!confirm('إلغاء هذه الفاتورة؟ سيُعاد المخزون وتُسجَّل قيود عكسية.'))return;
  const r=await call('void_invoice',{p_shop:S.shop.id,p_kind:x.kind,p_id:x.id});
  if(r===undefined)return;
  await refresh();toast('تم إلغاء الفاتورة ✓');histV()
}
function printInv(k){
  const x=S.hist[k];
  $('#rcpt').innerHTML=`<h3 style="text-align:center;margin:0">${esc(S.shop.name)}</h3><div style="text-align:center">${x.kind=='sale'?'فاتورة بيع':'فاتورة شراء'} · ${x.date}</div><hr>
  <table>${x.items.map(i=>`<tr><td>${esc(i.n)}<td>${fmt(i.q)}×${fmt(i.p)}<td>${fmt(i.q*i.p)}`).join('')}</table><hr>
  <b>الإجمالي: ${fmt(x.total)} ${x.currency}</b><br>المدفوع: ${fmt(x.paid)}<br>المتبقي: ${fmt(x.total-x.paid)}${x.voided_at?'<br><b>(ملغاة)</b>':''}`;
  print()
}

/* ---- المنتجات ---- */
function prodV(){
  const ow=S.role=='owner';
  $('#v').innerHTML=`${ow?`<div class=card><b>منتج جديد</b><input id=pn placeholder="الاسم"><input id=pb placeholder="الباركود (اختياري)">
  <div class=row><input id=pp type=number inputmode=decimal placeholder="سعر البيع"><select id=pc><option>SYP<option>USD</select></div>
  <input id=pm type=number inputmode=decimal placeholder="حد التنبيه للمخزون"><button class=b onclick="addProd()">حفظ</button></div>`:''}
  <div class=card>${S.prods.map(p=>`<div class=it ${ow?`onclick="editP('${p.id}')"`:''}><span>${esc(p.name)}<br><span class="m ${p.stock_qty<=p.min_stock?'neg':''}">المخزون ${fmt(p.stock_qty)}${ow?' · متوسط التكلفة '+fmt(p.avg_cost):''}</span></span><b>${fmt(p.sale_price)} ${p.sale_currency}</b></div>`).join('')||'<div class=m>لا منتجات بعد. المخزون يبدأ بفاتورة شراء.</div>'}
  <div class=m>اضغط على المنتج لتعديله أو حذفه</div></div>`
}
const dupMsg=e=>e.code=='23505'?'هذا الباركود مسجّل لمنتج آخر':e.message;
async function addProd(){
  const n=$('#pn').value.trim();if(!n)return toast('الاسم مطلوب');
  if(S.prods.some(p=>p.name==n)&&!confirm('يوجد منتج بنفس الاسم. هل تريد إضافة منتج آخر بنفس الاسم؟'))return;
  const {error}=await db.from('products').insert({shop_id:S.shop.id,name:n,barcode:$('#pb').value.trim()||null,sale_price:+$('#pp').value||0,sale_currency:$('#pc').value,min_stock:+$('#pm').value||0});
  if(error)return toast(dupMsg(error));
  await refresh();prodV()
}
function editP(id){
  const p=S.prods.find(x=>x.id==id);
  $('#v').innerHTML=`<div class=card><b>تعديل منتج</b><input id=en value="${esc(p.name)}"><input id=eb value="${esc(p.barcode||'')}" placeholder="الباركود">
  <div class=row><input id=ep type=number inputmode=decimal value="${p.sale_price}"><select id=ec><option>SYP<option>USD</select></div>
  <input id=ei type=number inputmode=decimal value="${p.min_stock}" placeholder="حد التنبيه للمخزون">
  <div class=row><button class=b onclick="saveP('${p.id}')">حفظ</button><button class="b s" onclick="prodV()">رجوع</button></div>
  <button class="b s neg" style="width:100%;margin-top:8px" onclick="delP('${p.id}')">حذف المنتج</button></div>`;
  $('#ec').value=p.sale_currency
}
async function saveP(id){
  const n=$('#en').value.trim();if(!n)return toast('الاسم مطلوب');
  const {error}=await db.from('products').update({name:n,barcode:$('#eb').value.trim()||null,sale_price:+$('#ep').value||0,sale_currency:$('#ec').value,min_stock:+$('#ei').value||0}).eq('id',id);
  if(error)return toast(dupMsg(error));
  await refresh();prodV();toast('تم الحفظ ✓')
}
async function delP(id){
  const p=S.prods.find(x=>x.id==id);
  if(!confirm('حذف "'+p.name+'"؟'+(p.stock_qty>0?'\nانتبه: له مخزون '+fmt(p.stock_qty)+' وسيختفي من القوائم.':'')+'\nالفواتير القديمة تبقى محفوظة.'))return;
  const {error}=await db.from('products').update({active:false,barcode:null}).eq('id',id);
  if(error)return toast(error.message);
  await refresh();prodV();toast('تم الحذف')
}

/* ---- الديون ---- */
async function debtV(){
  const {data}=await db.from('partner_balances').select('*').order('name');
  $('#v').innerHTML=`<div class=card><b>زبون / مورد جديد</b><input id=an placeholder="الاسم"><input id=ap placeholder="الهاتف">
  <select id=ak><option value=customer>زبون<option value=supplier>مورد</select><button class=b onclick="addPart()">حفظ</button></div>
  <div class=card>${(data||[]).map(p=>{const c=p.kind=='customer',v=c?p.receivable:p.payable;
  return `<div class=it onclick="partnerV('${p.id}')"><span>${esc(p.name)}<br><span class=m>${c?'زبون':'مورد'}</span></span><b class="${v>0?'neg':''}">${c?'عليه':'علينا'}: ${fmt(v)}</b></div>`}).join('')||'<div class=m>لا أطراف بعد</div>'}
  <div class=m>الأرصدة بالليرة. اضغط على الاسم للتفاصيل وكشف الحساب.</div></div>`
}
async function addPart(){
  const n=$('#an').value.trim();if(!n)return toast('الاسم مطلوب');
  const {error}=await db.from('partners').insert({shop_id:S.shop.id,name:n,phone:$('#ap').value.trim()||null,kind:$('#ak').value});
  if(error)return toast(error.message);
  await refresh();debtV()
}
async function pay(id,kind){
  const a=prompt(kind=='receipt'?'مبلغ القبض من الزبون':'مبلغ الدفع للمورد');if(!a)return;
  const cur=confirm('الدفعة بالدولار؟ (موافق = دولار، إلغاء = ليرة)')?'USD':'SYP';
  const r=await call('record_payment',{p_shop:S.shop.id,p_client:uid(),p_partner:id,p_kind:kind,p_amount:+a,p_currency:cur,p_rate:rate(cur)},true);
  if(r!==undefined){toast('تم ✓');partnerV(id)}
}

/* ---- التقارير ---- */
async function repV(){
  const [tb,dp,ls]=await Promise.all([
    db.from('trial_balance').select('*').order('code'),
    db.from('daily_profit').select('*').order('entry_date',{ascending:false}).limit(7),
    db.from('low_stock').select('name,stock_qty')]);
  const T=tb.data||[],g=c=>+(T.find(x=>x.code==c)||{balance:0}).balance;
  const profit=-T.filter(x=>x.type=='revenue'||x.type=='expense').reduce((s,x)=>s+ +x.balance,0);
  const R=[['الصندوق',g('1010')],['ذمم الزبائن (لنا)',g('1100')],['قيمة المخزون',g('1200')],['ذمم الموردين (علينا)',-g('2100')],['إجمالي المبيعات',-g('4100')],['صافي الربح',profit]];
  $('#v').innerHTML=`<div class=card id=per></div><div class=card>${R.map(([n,v])=>`<div class=it><span>${n}</span><b class="${v<0?'neg':''}">${fmt(v)}</b></div>`).join('')}<div class=m>كل الأرقام بالليرة</div></div>
  <div class=card><b>ربح آخر الأيام</b>${(dp.data||[]).map(x=>`<div class=it><span>${x.entry_date}</span><b>${fmt(x.profit)}</b></div>`).join('')||'<div class=m>لا بيانات</div>'}</div>
  <div class=card><b>بضاعة قاربت على الانتهاء</b>${(ls.data||[]).map(x=>`<div class=it><span>${esc(x.name)}</span><b class=neg>${fmt(x.stock_qty)}</b></div>`).join('')||'<div class=m>لا شيء</div>'}</div>
  <div class=card><div class=row><button class=b onclick="expense()">+ مصروف</button><button class="b s" onclick="equity('deposit')">+ رأس مال</button><button class="b s" onclick="equity('withdraw')">سحب المالك</button></div><button class="b s" style="width:100%;margin-top:8px" onclick="backup()">تنزيل نسخة احتياطية (JSON)</button></div>
  <div class=card><b>ميزان المراجعة</b><table><tr><th>الحساب<th>مدين<th>دائن${T.map(x=>`<tr><td>${esc(x.name)}<td>${fmt(x.debit)}<td>${fmt(x.credit)}`).join('')}</table></div>`;
  loadPeriod(0)
}
async function loadPeriod(n,from,to){
  if(!from)[from,to]=[ld(new Date(Date.now()-n*864e5)),today()];
  const {data,error}=await db.rpc('period_report',{p_shop:S.shop.id,p_from:from,p_to:to});
  if(error)return toast(error.message);
  const g=c=>{const x=(data||[]).find(r=>r.code==c);return x?+x.credit-+x.debit:0};
  const sales=g('4100'),cogs=-g('5100'),exp=-g('5200'),gross=sales-cogs;
  $('#per').innerHTML=`<b>تقرير الفترة</b>
  <div class=row style="margin:6px 0"><button class="b s" onclick="loadPeriod(0)">اليوم</button><button class="b s" onclick="loadPeriod(6)">7 أيام</button><button class="b s" onclick="loadPeriod(29)">30 يوماً</button></div>
  <div class=row><input id=pf type=date value="${from}"><input id=pt2 type=date value="${to}"></div>
  <button class="b s" style="width:100%;margin-bottom:6px" onclick="loadPeriod(0,$('#pf').value,$('#pt2').value)">عرض</button>
  ${[['المبيعات',sales],['تكلفة البضاعة',cogs],['الربح الإجمالي',gross],['المصاريف',exp],['صافي الربح',gross-exp]].map(([n,v])=>`<div class=it><span>${n}</span><b class="${v<0?'neg':''}">${fmt(v)}</b></div>`).join('')}
  <div class=m>${from} ← ${to} · بالليرة</div>`
}
async function all(t){
  let o=[],i=0;
  for(;;){const {data,error}=await db.from(t).select('*').order('id').range(i,i+999);if(error)throw error;o=o.concat(data);if(data.length<1000)return o;i+=1000}
}
async function backup(){
  try{
    const d={exported_at:new Date().toISOString(),shop:S.shop};
    for(const t of ['accounts','partners','products','sales','sale_items','purchases','purchase_items','stock_movements','journal_entries','journal_lines'])d[t]=await all(t);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));
    a.download='backup-'+today()+'.json';a.click();toast('تم تنزيل النسخة الاحتياطية ✓')
  }catch(e){toast(e.message)}
}
async function expense(){
  const a=prompt('مبلغ المصروف بالليرة');if(!a)return;const d=prompt('البيان','مصروف');
  const r=await call('record_expense',{p_shop:S.shop.id,p_client:uid(),p_amount:+a,p_currency:'SYP',p_rate:1,p_desc:d||'مصروف'},true);
  if(r!==undefined)repV()
}
async function equity(dir){
  const a=prompt(dir=='deposit'?'مبلغ رأس المال المُضاف (ليرة)':'مبلغ سحب المالك (ليرة)');if(!a)return;
  const r=await call('record_equity',{p_shop:S.shop.id,p_client:uid(),p_amount:+a,p_currency:'SYP',p_rate:1,p_direction:dir},true);
  if(r!==undefined)repV()
}
boot();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
